---

paths:

  /web/metalakes/{metalake}/summary:
    get:
      tags:
        - metalake
      summary: Get metalake summary
      operationId: getMetalakeSummary
      description: |
        Return aggregate metadata counts for the specified metalake. The counts are read from
        persisted Gravitino metadata rather than the search index or asynchronous dashboard metric
        snapshots, so they are exact and independent of background refreshes. The endpoint requires
        metalake ownership and returns counts without per-object visibility filtering. The catalog
        count is always present; user and role counts are exact when authorization is enabled and
        null otherwise. The owner includes its name and user/group type, or is explicitly null when
        unassigned or authorization is disabled. Disabled metalakes are supported without temporarily
        enabling the metalake.
      parameters:
        - name: metalake
          in: path
          description: The metalake name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the summary of the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/MetalakeSummaryResponse"
              examples:
                userOwner:
                  summary: A metalake owned by a user
                  value:
                    code: 0
                    catalogCount: 2
                    userCount: 3
                    roleCount: 1
                    owner:
                      name: alice
                      type: user
                groupOwner:
                  summary: A metalake owned by a group
                  value:
                    code: 0
                    catalogCount: 2
                    userCount: 3
                    roleCount: 1
                    owner:
                      name: data-admins
                      type: group
                unassignedOwner:
                  summary: A metalake without an assigned owner
                  value:
                    code: 0
                    catalogCount: 2
                    userCount: 3
                    roleCount: 1
                    owner: null
                accessControlDisabled:
                  summary: Access control is disabled
                  value:
                    code: 0
                    catalogCount: 2
                    owner: null
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: Forbidden - The caller is not an owner of the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    MetalakeSummaryResponse:
      type: object
      required:
        - code
        - catalogCount
        - owner
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        catalogCount:
          type: integer
          format: int64
          minimum: 0
          description: The number of catalogs in the metalake
        userCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            The number of users in the metalake. Null when access control is disabled because user
            data is unavailable.
        roleCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            The number of roles in the metalake. Null when access control is disabled because role
            data is unavailable.
        owner:
          type: object
          nullable: true
          description: The metalake owner, or null when unassigned or access control is disabled.
          required:
            - name
            - type
          properties:
            name:
              type: string
              description: The name of the user or group that owns the metalake.
            type:
              type: string
              description: The owner type, serialized in lowercase by the web API.
              enum:
                - user
                - group
