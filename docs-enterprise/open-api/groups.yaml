---

paths:

  /web/security/directory/groups:
    get:
      tags:
        - groups
      summary: List Directory Groups
      operationId: listDirectoryGroups
      description: |
        List Directory Groups for Configure → Directory → Groups.

        Rows come from:
        - `idp_group_meta` → `origin=Local`
        - `scim_group_meta` (not also in IdP) → `origin=Provisioned`
        - distinct `group_meta` names absent from IdP and SCIM → `origin=JIT`

        `memberCount` is the identity-store membership count (0 for JIT). `metalakes` are metalake
        names where the group name exists in `group_meta`.

      responses:
        "200":
          description: Returns the list of directory groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryGroupListResponse"
              examples:
                DirectoryGroupListResponse:
                  $ref: "#/components/examples/DirectoryGroupListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/groups:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - groups
      summary: List metalake groups for the security UI
      operationId: listSecurityGroups
      description: |
        List groups under a metalake for the enterprise security Groups page.

        Returns OSS group fields plus `origin` and `userCount`. `origin` is `Local` when the group
        name exists in the built-in IdP (`idp_group_meta`) and `Provisioned` otherwise. `userCount`
        is the number of metalake users in the group (local groups from built-in IdP membership,
        provisioned groups from SCIM).

      responses:
        "200":
          description: Returns the list of groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedGroupListResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - groups
      summary: Add an existing local group into a metalake
      operationId: addSecurityGroup
      description: |
        Add an existing built-in IdP group into a metalake for the enterprise security Groups page.

        Requires the group name to already exist in the built-in IdP. If it does not, returns 404 and
        does not write `group_meta`. If the group is already in `group_meta` for the metalake,
        returns 409. Otherwise creates the metalake `group_meta` row and optionally grants metalake
        roles. This API does not create a built-in IdP group.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalGroupAddRequest"
            examples:
              LocalGroupAddRequest:
                $ref: "#/components/examples/LocalGroupAddRequest"

      responses:
        "200":
          description: Returns the metalake group
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedGroupResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target metalake or IdP group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "409":
          description: Conflict - The metalake group already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/groups/{group}/users:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
    get:
      tags:
        - groups
      summary: List members of a metalake group
      operationId: listSecurityGroupUsers
      description: |
        List metalake users that belong to the group for the security group Members tab.

        Local groups (`externalId` blank) resolve membership from the built-in IdP. Provisioned
        groups resolve membership from SCIM. Each user includes `origin` and the user's metalake
        roles.

      responses:
        "200":
          description: Returns the users
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./users.yaml#/components/schemas/ExtendedUserListResponse"
        "404":
          description: Not Found - The target metalake or group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchGroupException:
                  $ref: "../../docs/open-api/groups.yaml#/components/examples/NoSuchGroupException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/groups/idp:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - groups
      summary: List built-in IdP groups with metalake membership status
      operationId: listSecurityIdpGroups
      description: |
        List built-in IdP groups for the security UI picker used when adding a local group.

        Each item has `name` and `status`. `status` is `true` when that group name is already in
        this metalake.

      responses:
        "200":
          description: Returns the list of IdP groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/IdpGroupNameListResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    IdentitySource:
      type: string
      description: |
        Source of the identity. Serialized as `origin`. `Local` when the name exists in the
        built-in IdP (`idp_group_meta`) and `Provisioned` otherwise.
      enum:
        - Local
        - Provisioned

    ExtendedGroup:
      allOf:
        - $ref: "../../docs/open-api/groups.yaml#/components/schemas/Group"
        - type: object
          required:
            - origin
            - userCount
          properties:
            origin:
              $ref: "#/components/schemas/IdentitySource"
            userCount:
              type: integer
              format: int32
              description: >
                Number of metalake users in the group for the security Groups table. Local groups
                count built-in IdP membership; provisioned groups count SCIM membership.

    IdpNameStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Built-in IdP group name
        status:
          type: boolean
          description: >
            Whether the group is already added to this metalake. `true` means it already exists
            in the metalake.

    IdpGroupNameListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        groups:
          type: array
          description: Built-in IdP groups with metalake membership status
          items:
            $ref: "#/components/schemas/IdpNameStatus"

    ExtendedGroupListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        groups:
          type: array
          description: A list of groups with origin for the security UI
          items:
            $ref: "#/components/schemas/ExtendedGroup"

    LocalGroupAddRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            The group name to add to the metalake. Must already exist in the built-in IdP.
        roles:
          type: array
          items:
            type: string
            minLength: 1
          description: Optional metalake roles to grant to the group

    ExtendedGroupResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        group:
          $ref: "#/components/schemas/ExtendedGroup"

    DirectoryGroupDTO:
      type: object
      required:
        - name
        - memberCount
        - origin
        - metalakes
      properties:
        name:
          type: string
          description: Group name
        memberCount:
          type: integer
          format: int32
          description: Identity-store member count
        origin:
          $ref: "./users.yaml#/components/schemas/IdentitySource"
        metalakes:
          type: array
          description: Metalake names containing this group
          items:
            type: string

    DirectoryGroupListResponse:
      type: object
      required:
        - code
        - groups
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryGroupDTO"

  examples:
    LocalGroupAddRequest:
      value:
        name: contractors
        roles:
          - Analyst

    DirectoryGroupListResponse:
      value:
        code: 0
        groups:
          - name: analysts
            memberCount: 0
            origin: JIT
            metalakes:
              - Contoso
              - Northwind
          - name: contractors
            memberCount: 0
            origin: Local
            metalakes:
              - Acme
          - name: governance
            memberCount: 2
            origin: Local
            metalakes:
              - Acme
              - Contoso
          - name: platform
            memberCount: 1
            origin: Provisioned
            metalakes:
              - Contoso
