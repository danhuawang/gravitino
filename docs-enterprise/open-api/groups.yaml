---

paths:

  /internal/security/idp/groups:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - groups
      summary: List assignable group names
      operationId: listLocalIdpGroupNames
      description: |
        List distinct active group names for Add-role group member pickers.

        Names come from `scim_group_meta`, `idp_group_meta`, and `jit_group_meta`, plus
        metalake-only rows in `group_meta` (not present in any identity store). UNION
        deduplicates across sources.

        Instance-scoped: no metalake parameter. Returns names only — does not report metalake
        membership or origin.

      responses:
        "200":
          description: Returns the deduplicated list of group names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/groups:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - groups
      summary: List Directory Groups
      operationId: listDirectoryGroups
      description: |
        List Directory Groups for Configure → Directory → Groups.

        Rows come from each identity store without merging:
        - `idp_group_meta` → `origin=Local`
        - `scim_group_meta` → `origin=Provisioned`
        - `jit_group_meta` → `origin=JIT`
        - metalake-only (`group_meta`, not in IdP, SCIM, or JIT) → `origin` omitted (`null`),
          `memberCount=0`

        The same group name may appear more than once when it exists in multiple stores.
        `memberCount` is the identity-store membership count for that row's origin. `metalakes`
        are metalake names where the group name exists in `group_meta`.

      responses:
        "200":
          description: Returns the list of directory groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryGroupListResponse"
              examples:
                DirectoryGroupListResponse:
                  $ref: "#/components/examples/DirectoryGroupListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - groups
      summary: Add Directory Group
      operationId: addDirectoryGroup
      description: |
        Create a Local Directory Group in `idp_group_meta` and add built-in IdP users as members.

        Validates that every listed member exists in `idp_user_meta` first, then inserts the group
        and writes `idp_user_group_rel` membership rows in one transaction. Does not create
        metalake `group_meta` rows.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryGroupAddRequest"
            examples:
              DirectoryGroupAddRequest:
                $ref: "#/components/examples/DirectoryGroupAddRequest"

      responses:
        "200":
          description: Returns the created Directory Group
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryGroupResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - One or more members do not exist in the built-in IdP
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "409":
          description: Conflict - The group name already exists in `idp_group_meta`
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/groups/{group}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
      - name: origin
        in: query
        required: false
        schema:
          type: string
          enum:
            - Local
            - Provisioned
            - JIT
        description: >
          Identity origin of the Directory Group (`Local`, `Provisioned`, or `JIT`). Omit for a
          metalake-only group (present in `group_meta` but not in IdP, SCIM, or JIT).
    get:
      tags:
        - groups
      summary: Get a Directory Group
      operationId: getDirectoryGroup
      description: |
        Get one Directory Group for Configure → Directory → Group Overview.

        `origin`:
        - `Local` → load from `idp_group_meta` with IdP membership count
        - `Provisioned` → load from `scim_group_meta` with SCIM membership count
        - `JIT` → load from `jit_group_meta` with JIT membership count
        - omitted → metalake-only (`group_meta`, not in IdP, SCIM, or JIT): `origin` omitted,
          `memberCount` 0. `createTime` is the earliest `group_meta.audit_info.createTime` across
          every metalake row for that group name.

        Detail is keyed by (group name, origin); cross-store names are not excluded.
        `memberCount` maps to Members on the Overview. For Local / Provisioned / JIT, `createTime`
        comes from identity-store `audit_info.createTime`.

      responses:
        "200":
          description: Returns the Directory Group detail
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryGroupDetailResponse"
              examples:
                DirectoryGroupDetailResponse:
                  $ref: "#/components/examples/DirectoryGroupDetailResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The Directory Group does not exist for that origin
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/groups/{group}/users:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
      - name: origin
        in: query
        required: false
        schema:
          type: string
          enum:
            - Local
            - Provisioned
            - JIT
        description: >
          Identity origin of the Directory Group (`Local`, `Provisioned`, or `JIT`). Omit for a
          metalake-only group (returns an empty `users` array after the group exists in
          `group_meta` only).
    get:
      tags:
        - groups
      summary: List members of a Directory Group
      operationId: listDirectoryGroupUsers
      description: |
        List identity-store users for Configure → Directory → Group → Members.

        `origin`:
        - `Local` → membership from `idp_user_group_rel` / `idp_user_meta`
        - `Provisioned` → membership from `scim_user_group_rel` / `scim_user_meta`
        - `JIT` → membership from `jit_user_group_rel` / `jit_user_meta`
        - omitted → metalake-only group: empty `users` array (404 if the name is not metalake-only)

        Each user includes `name` (Username), `enabled` (Status: Active / Suspended), and `origin`
        matching the group's identity store. `groups` and `metalakes` are empty on this response.
        Missing group for that origin returns 404; a group with no members returns an empty `users`
        array. Footer member count is the length of `users`.

      responses:
        "200":
          description: Returns the Directory Group's members
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./users.yaml#/components/schemas/DirectoryUserListResponse"
              examples:
                DirectoryGroupUsersResponse:
                  $ref: "#/components/examples/DirectoryGroupUsersResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The Directory Group does not exist for that origin
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/groups/delete:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    post:
      tags:
        - groups
      summary: Delete Directory Groups
      operationId: deleteDirectoryGroups
      description: |
        Soft-delete Local Directory Groups via the built-in IdP (`idp_group_meta` and
        `idp_user_group_rel`).

        Validates that every listed `origin` is `Local` (request field only; no existence check).
        Then soft-deletes each group through the IdP manager with force (memberships removed).
        Metalake `group_meta` rows are left unchanged.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryGroupDeleteRequest"
            examples:
              DirectoryGroupDeleteRequest:
                $ref: "#/components/examples/DirectoryGroupDeleteRequest"

      responses:
        "200":
          description: Returns the soft-deleted group names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/groups:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - groups
      summary: List metalake groups for the security UI
      operationId: listSecurityGroups
      description: |
        List groups under a metalake for the enterprise security Groups page.

        Returns OSS group fields plus `origin` and `userCount`. `origin` is:
        - `Local` when the group name exists in `idp_group_meta`
        - `Provisioned` when it exists in `scim_group_meta` (and not IdP)
        - omitted (`null`) when it exists in neither identity store (not inferred as `JIT`)

        `userCount` is the number of metalake users in the group (Members): Local from IdP
        membership, Provisioned from SCIM; otherwise metalake membership count still applies.

      responses:
        "200":
          description: Returns the list of groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedGroupListResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - groups
      summary: Add an existing local group into a metalake
      operationId: addSecurityGroup
      description: |
        Add an existing built-in IdP group into a metalake for the enterprise security Groups page.

        Requires the group name to already exist in the built-in IdP. If it does not, returns 404 and
        does not write `group_meta`. If the group is already in `group_meta` for the metalake,
        returns 409. Otherwise creates the metalake `group_meta` row and optionally grants metalake
        roles. This API does not create a built-in IdP group.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalGroupAddRequest"
            examples:
              LocalGroupAddRequest:
                $ref: "#/components/examples/LocalGroupAddRequest"

      responses:
        "200":
          description: Returns the metalake group
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedGroupResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target metalake or IdP group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "409":
          description: Conflict - The metalake group already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/groups/{group}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
    get:
      tags:
        - groups
      summary: Get a metalake group for the security UI
      operationId: getSecurityGroup
      description: |
        Get a metalake group for the enterprise security group Overview page.

        Returns OSS group fields plus `origin` and `userCount`. `origin` is:
        - `Local` when the group name exists in `idp_group_meta`
        - `Provisioned` when it exists in `scim_group_meta` (and not IdP)
        - omitted (`null`) when it exists in neither identity store (not inferred as `JIT`)

        `userCount` is the number of metalake users in the group (Members on the Overview page).
        `auditInfo.createTime` maps to Added.

      responses:
        "200":
          description: Returns the group
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedGroupResponse"
        "404":
          description: Not Found - The target metalake or group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchGroupException:
                  $ref: "../../docs/open-api/groups.yaml#/components/examples/NoSuchGroupException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/groups/{group}/users:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
    get:
      tags:
        - groups
      summary: List members of a metalake group
      operationId: listSecurityGroupUsers
      description: |
        List metalake users that belong to the group for the security group Members tab.

        Membership comes from the identity store for the group: `idp_user_group_rel` when the
        group name exists in `idp_group_meta` (and not SCIM), otherwise `scim_user_group_rel` when
        it exists in `scim_group_meta`.

        Each user includes `origin`, `enabled` (Status), and optional `externalId`:
        - `origin` is `Local` when the username exists in `idp_user_meta`, `Provisioned` when it
          exists in `scim_user_meta` (and not IdP), otherwise omitted (`null`)
        - `enabled` comes from `idp_user_meta` or `scim_user_meta`, defaulting to Active when
          neither has a row
        - `externalId` is set for Provisioned users from `scim_user_meta` and omitted otherwise

        Footer member count is the length of the returned `users` array (no separate `userCount`
        field on this response).

      responses:
        "200":
          description: Returns the users
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./users.yaml#/components/schemas/ExtendedUserListResponse"
        "404":
          description: Not Found - The target metalake or group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchGroupException:
                  $ref: "../../docs/open-api/groups.yaml#/components/examples/NoSuchGroupException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/groups/{group}/roles:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/group"
    get:
      tags:
        - groups
      summary: List roles assigned to a group
      operationId: listGroupRoleAssignments
      description: |
        Returns all roles directly assigned to one metalake group. Each item includes role
        metadata, direct user and group members, the role owner, and audit information
        recorded on the group-role assignment relation. Role privileges are not returned.
      responses:
        "200":
          description: Returns the group's role assignments
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./authorization.yaml#/components/schemas/RoleAssignmentDetailsListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchGroupException:
                  $ref: "../../docs/open-api/groups.yaml#/components/examples/NoSuchGroupException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    IdentitySource:
      type: string
      description: |
        Source of the identity. Serialized as `origin`.

        - `Local`: name exists in the built-in IdP (`idp_group_meta`)
        - `Provisioned`: name exists in SCIM (`scim_group_meta`) and not IdP
        - `JIT`: reserved for write-time JWT discovery; metalake list/get no longer infer JIT from
          absence in IdP/SCIM (those rows omit `origin`)
      enum:
        - Local
        - Provisioned
        - JIT

    ExtendedGroup:
      allOf:
        - $ref: "../../docs/open-api/groups.yaml#/components/schemas/Group"
        - type: object
          required:
            - userCount
          properties:
            origin:
              type: string
              nullable: true
              allOf:
                - $ref: "#/components/schemas/IdentitySource"
              description: >
                Identity source when known. Omitted when the name matches neither IdP nor SCIM.
            userCount:
              type: integer
              format: int32
              description: >
                Number of metalake users in the group (Members). Counted from IdP membership for
                Local, SCIM membership for Provisioned, and metalake membership otherwise.

    ExtendedGroupListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        groups:
          type: array
          description: A list of groups with origin for the security UI
          items:
            $ref: "#/components/schemas/ExtendedGroup"

    LocalGroupAddRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            The group name to add to the metalake. Must already exist in the built-in IdP.
        roles:
          type: array
          items:
            type: string
            minLength: 1
          description: Optional metalake roles to grant to the group

    DirectoryGroupDeleteRequest:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          minItems: 1
          description: Directory groups to delete; every origin must be Local
          items:
            $ref: "#/components/schemas/DirectoryGroupDelete"

    DirectoryGroupDelete:
      type: object
      required:
        - name
        - origin
      properties:
        name:
          type: string
          description: Group name
        origin:
          $ref: "#/components/schemas/IdentitySource"

    DirectoryGroupAddRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Group name to create in idp_group_meta
        comment:
          type: string
          maxLength: 1024
          description: Optional group comment
        members:
          type: array
          description: Built-in IdP usernames to add as members
          items:
            type: string
            minLength: 1
            maxLength: 128

    DirectoryGroupResponse:
      type: object
      required:
        - code
        - group
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        group:
          $ref: "#/components/schemas/DirectoryGroupDTO"

    DirectoryGroupDetailDTO:
      type: object
      required:
        - name
        - memberCount
      properties:
        name:
          type: string
          description: Group name
        memberCount:
          type: integer
          format: int32
          description: Identity-store member count (0 for metalake-only)
        origin:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IdentitySource"
          description: Omitted for metalake-only groups (not in IdP, SCIM, or JIT).
        createTime:
          type: string
          format: date-time
          nullable: true
          description: >
            Created on Overview. Local / Provisioned / JIT: identity-store `audit_info.createTime`.
            Metalake-only: earliest `group_meta.audit_info.createTime` across metalakes.
            Omitted when audit data is unavailable.

    DirectoryGroupDetailResponse:
      type: object
      required:
        - code
        - group
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        group:
          $ref: "#/components/schemas/DirectoryGroupDetailDTO"

    ExtendedGroupResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        group:
          $ref: "#/components/schemas/ExtendedGroup"

    DirectoryGroupDTO:
      type: object
      required:
        - name
        - memberCount
        - metalakes
      properties:
        name:
          type: string
          description: Group name
        memberCount:
          type: integer
          format: int32
          description: Identity-store member count (0 for metalake-only)
        origin:
          type: string
          nullable: true
          allOf:
            - $ref: "./users.yaml#/components/schemas/IdentitySource"
          description: >
            Identity source when known. Omitted when the name is metalake-only (not in IdP, SCIM,
            or JIT).
        metalakes:
          type: array
          description: Metalake names containing this group
          items:
            type: string

    DirectoryGroupListResponse:
      type: object
      required:
        - code
        - groups
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
        groups:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryGroupDTO"

  examples:
    LocalGroupAddRequest:
      value:
        name: contractors
        roles:
          - Analyst

    DirectoryGroupDeleteRequest:
      value:
        groups:
          - name: contractors
            origin: Local
          - name: governance
            origin: Local

    DirectoryGroupAddRequest:
      value:
        name: contractors
        comment: External analysts on time-boxed access
        members:
          - sam.o
          - lee.p

    DirectoryGroupListResponse:
      value:
        code: 0
        groups:
          - name: contractors
            memberCount: 0
            origin: Local
            metalakes:
              - Acme
          - name: governance
            memberCount: 2
            origin: Local
            metalakes:
              - Acme
              - Contoso
          - name: platform
            memberCount: 1
            origin: Provisioned
            metalakes:
              - Contoso

    DirectoryGroupDetailResponse:
      value:
        code: 0
        group:
          name: governance
          memberCount: 2
          origin: Provisioned
          createTime: "2025-09-14T00:00:00Z"

    DirectoryGroupUsersResponse:
      value:
        code: 0
        users:
          - name: dana.k
            enabled: true
            origin: Provisioned
            groups: []
            metalakes: []
          - name: ivanne
            enabled: false
            origin: Provisioned
            groups: []
            metalakes: []
