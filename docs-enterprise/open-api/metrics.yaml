---

paths:

  /internal/metrics/metalakes/{metalake}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - metrics
      summary: Get metrics
      operationId: getMetrics
      description: |
        Get asset metrics under the specified metalake for the request user, this endpoint is used for dashboard in Web UI.
      parameters:
        - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
        - name: metrics
          in: query
          description: |
            The metrics to retrieve as a comma-separated list of metric names. If omitted, all metrics are returned.

            Metric-name forms are:
            - Global: `<metric>`, where `metric` is `asset_count`, `tagged_asset_count`, `owned_asset_count`, `policy_covered_asset_count`, `policy_count`, or `disabled_policy_count`.
            - By asset type: `by_asset_type::<assetType>::<assetMetric>`, where `assetType` is `TABLE`, `VIEW`, `FUNCTION`, `TOPIC`, `FILESET`, or `MODEL` and `assetMetric` is one of the four asset metrics.
            - By catalog: `by_catalog::<catalogName>::<provider>::<assetMetric>`, for example `by_catalog::sales::jdbc-postgresql::asset_count`.
            - Catalog counts: `by_catalog::<catalogName>::<catalogMetric>`, where `catalogMetric` is `schema_count`, `table_count`, `view_count`, `function_count`, `fileset_count`, `model_count`, `topic_count`, `associated_tag_count`, or `associated_policy_count`.

            The four asset metrics are `asset_count`, `tagged_asset_count`, `owned_asset_count`, and `policy_covered_asset_count`. The per-catalog `provider` is the catalog provider short name returned by the Catalog API, including installed custom providers.

            Catalog object-count metrics are returned only when the Catalog supports the corresponding object type. A supported object type with no objects returns zero; an unsupported object type has no metric entry. `associated_tag_count` and `associated_policy_count` count distinct, current Tag or Policy IDs with an active direct association to the Catalog or one of its supported descendants other than Columns. Inherited occurrences are not counted again, Column Tag associations are excluded, and disabled Policies are included.
          required: false
          schema:
            type: string
        - name: startTimestamp
          in: query
          description: The start timestamp in milliseconds since epoch. If not specified, it defaults to the beginning of the current day.
          required: false
          schema:
            type: integer
            format: int64
        - name: endTimestamp
          in: query
          description: The end timestamp in milliseconds since epoch. If not specified, it defaults to the current time.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Returns the metrics for the specified metalake and parameters.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    MetricsResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        metrics:
          type: object
          description: A map of metric data, where the key is the metric name.
          additionalProperties:
            $ref: '#/components/schemas/Metric'

    Metric:
      type: object
      description: Represents a single time-series metric. All data-point arrays have equal length and matching indexes.
      required:
        - name
        - values
        - timestamps
        - states
        - messages
      properties:
        name:
          type: string
          description: |
            The metric name. Per-catalog asset metric names use `by_catalog::<catalogName>::<provider>::<assetMetric>`, where `provider` is the provider short name returned by the Catalog API. Catalog count metric names use `by_catalog::<catalogName>::<catalogMetric>`. Examples: `by_catalog::sales::jdbc-postgresql::asset_count` and `by_catalog::sales::table_count`.
        values:
          type: array
          description: The metric values. An unavailable data point is represented by null.
          items:
            type: number
            format: double
            nullable: true
        timestamps:
          type: array
          description: The array of timestamps corresponding to the metric values.
          items:
            type: integer
            format: int64
        states:
          type: array
          description: The collection state corresponding to each metric value.
          items:
            $ref: '#/components/schemas/MetricState'
        messages:
          type: array
          description: Safe human-readable collection messages corresponding to each metric value.
          items:
            type: string
            nullable: true

    MetricState:
      type: string
      description: COMPLETE has a value from all dependencies; PARTIAL has a value from a successful subset; UNAVAILABLE has a null value.
      enum:
        - COMPLETE
        - PARTIAL
        - UNAVAILABLE
