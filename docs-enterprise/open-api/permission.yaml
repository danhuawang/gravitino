---

paths:

  /web/security/metalakes/{metalake}/roles/{role}:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/role"
    put:
      tags:
        - permissions
      summary: update bulk objects' privileges
      operationId: bulkUpdateSecurableObjects
      description: |
        Update the privileges of the bulk securable objects for a specific role in a metalake.

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionUpdateRequest"

      responses:
        "200":
          description: Returns the updated role
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/roles.yaml#/components/responses/RoleResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target role does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchRoleException:
                  $ref: "../../docs/open-api/roles.yaml#/components/examples/NoSuchRoleException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/roles/assignments:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    put:
      tags:
        - permissions
      summary: Assign multiple roles to multiple users and groups
      operationId: assignRolesToPrincipals
      description: |
        Assigns all requested roles to all requested users and groups atomically. Existing active
        assignments are retained with their original assignment audit information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentRequest"
      responses:
        "200":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - A target metalake, role, user, or group does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/roles/{role}/users:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/role"
    get:
      tags:
        - permissions
      summary: List users associated with a role
      operationId: listUsersByRole
      description: |
        Lists users associated with a specific role in a metalake, including the audit information
        of each role assignment and whether each user is local or provisioned.
      responses:
        "200":
          description: Returns the users associated with the role
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/RoleUserAssignmentListResponse"
              examples:
                RoleUserAssignmentListResponse:
                  $ref: "#/components/examples/RoleUserAssignmentListResponse"
        "404":
          description: Not Found - The target metalake or role does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchRoleException:
                  $ref: "../../docs/open-api/roles.yaml#/components/examples/NoSuchRoleException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/roles/{role}/groups:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/role"
    get:
      tags:
        - permissions
      summary: List groups associated with a role
      operationId: listGroupsByRole
      description: |
        Lists groups associated with a specific role in a metalake, including the audit information
        of each role assignment and the number of metalake users in each group.
      responses:
        "200":
          description: Returns the groups associated with the role
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/RoleGroupAssignmentListResponse"
              examples:
                RoleGroupAssignmentListResponse:
                  $ref: "#/components/examples/RoleGroupAssignmentListResponse"
        "404":
          description: Not Found - The target metalake or role does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchRoleException:
                  $ref: "../../docs/open-api/roles.yaml#/components/examples/NoSuchRoleException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    PermissionUpdateRequest:
      type: object
      properties:
        updates:
          type: array
          description: A list of securable objects to update
          items:
            $ref: "../../docs/open-api/roles.yaml#/components/schemas/SecurableObject"

    RoleAssignmentRequest:
      type: object
      description: Roles to assign and the users and groups that receive them
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Role names to assign
          items:
            type: string
            minLength: 1
        users:
          type: array
          uniqueItems: true
          description: User names to assign
          items:
            type: string
            minLength: 1
        groups:
          type: array
          uniqueItems: true
          description: Group names to assign
          items:
            type: string
            minLength: 1
      anyOf:
        - required:
            - users
          properties:
            users:
              minItems: 1
        - required:
            - groups
          properties:
            groups:
              minItems: 1
    IdentitySource:
      type: string
      description: |
        Source of the identity. `Local` when the username exists in the built-in IdP and
        `Provisioned` otherwise.
      enum:
        - Local
        - Provisioned

    RoleUserAssignment:
      allOf:
        - $ref: "../../docs/open-api/users.yaml#/components/schemas/User"
        - type: object
          required:
            - origin
            - assignmentAudit
          properties:
            origin:
              $ref: "#/components/schemas/IdentitySource"
            assignmentAudit:
              $ref: "../../docs/open-api/openapi.yaml#/components/schemas/Audit"

    RoleGroupAssignment:
      allOf:
        - $ref: "../../docs/open-api/groups.yaml#/components/schemas/Group"
        - type: object
          required:
            - assignmentAudit
            - userCount
          properties:
            assignmentAudit:
              $ref: "../../docs/open-api/openapi.yaml#/components/schemas/Audit"
            userCount:
              type: integer
              format: int32
              minimum: 0
              description: Number of users in the group that belong to the metalake

    RoleUserAssignmentListResponse:
      type: object
      required:
        - code
        - users
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 0
        users:
          type: array
          items:
            $ref: "#/components/schemas/RoleUserAssignment"

    RoleGroupAssignmentListResponse:
      type: object
      required:
        - code
        - groups
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 0
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RoleGroupAssignment"

  examples:
    RoleUserAssignmentListResponse:
      value:
        code: 0
        users:
          - name: alice
            enabled: true
            roles: []
            origin: Local
            assignmentAudit:
              creator: admin
              createTime: "2026-08-28T01:02:03Z"

    RoleGroupAssignmentListResponse:
      value:
        code: 0
        groups:
          - name: analysts
            roles: []
            userCount: 12
            assignmentAudit:
              creator: admin
              createTime: "2026-08-28T01:02:03Z"
