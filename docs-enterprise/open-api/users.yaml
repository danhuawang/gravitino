---

paths:

  /web/security/metalakes/{metalake}/users:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - users
      summary: List metalake users for the security UI
      operationId: listSecurityUsers
      description: |
        List users under a metalake for the enterprise security Users page.

        Returns OSS user fields plus `origin`. `origin` is `Local` when `externalId` is blank and
        `Provisioned` when `externalId` is present. `enabled` maps to Active / Suspended in the UI.

      responses:
        "200":
          description: Returns the list of users
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedUserListResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/users/enabled:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    put:
      tags:
        - users
      summary: Batch update user enabled
      operationId: batchUpdateUserEnabled
      description: |
        Batch-update the `enabled` flag for metalake users by username.

        The update validates first that every listed user exists under the metalake and has no
        `externalId`. Only then is a single UPDATE executed. Otherwise the request fails and no user
        is updated.

        Missing metalake returns 404. Missing users or users with `externalId` return 400.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEnabledBatchUpdateRequest"

      responses:
        "200":
          description: Returns the updated user names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    IdentitySource:
      type: string
      description: |
        Source of the identity. Serialized as `origin`. `Local` when `externalId` is blank;
        `Provisioned` when `externalId` is present.
      enum:
        - Local
        - Provisioned

    ExtendedUser:
      allOf:
        - $ref: "../../docs/open-api/users.yaml#/components/schemas/User"
        - type: object
          required:
            - origin
          properties:
            origin:
              $ref: "#/components/schemas/IdentitySource"

    ExtendedUserListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        users:
          type: array
          description: A list of users with origin for the security UI
          items:
            $ref: "#/components/schemas/ExtendedUser"

    UserEnabledBatchUpdateRequest:
      type: object
      required:
        - users
        - enabled
      properties:
        users:
          type: array
          items:
            type: string
          description: User names to update under the metalake
        enabled:
          type: boolean
          description: Target enabled value for all listed users
