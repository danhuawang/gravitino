---

paths:

  /internal/security/idp/users:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - users
      summary: List assignable user names
      operationId: listLocalIdpUserNames
      description: |
        List distinct active usernames for Add-role user member pickers.

        Names come from `scim_user_meta`, `idp_user_meta`, and `jit_user_meta`, plus
        metalake-only rows in `user_meta` (not present in any identity store). UNION deduplicates
        across sources.

        Instance-scoped: no metalake parameter. Returns names only — does not report metalake
        membership or origin.

      responses:
        "200":
          description: Returns the deduplicated list of usernames
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/idp/users/password:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    put:
      tags:
        - users
      summary: Change a Local IdP user password
      operationId: changeLocalIdpUserPassword
      description: |
        Change a Local (built-in IdP) user password after verifying the current password.

        Request body fields: `username`, `oldPassword`, `newPassword`.

        Authorization: service admin, or the signed-in user matching `username`. The current
        password must always be correct before the update is applied.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdpPasswordChangeRequest"
            examples:
              IdpPasswordChangeRequest:
                $ref: "#/components/examples/IdpPasswordChangeRequest"
      responses:
        "200":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "401":
          description: Unauthorized - Invalid username or old password
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "403":
          description: Forbidden - Caller is neither service admin nor the target user
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/idp/memberships:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    post:
      tags:
        - users
      summary: Add Local IdP users to Local IdP groups
      operationId: addLocalIdpMemberships
      description: |
        Add Local (built-in IdP) users to Local IdP groups.

        Builds the cartesian product of `usernames` × `groupNames` and adds missing memberships via
        the built-in IdP. Existing active memberships are skipped and do not fail the request
        (idempotent). Every username must exist in `idp_user_meta` and every group name in
        `idp_group_meta`.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdpMembershipAddRequest"
            examples:
              IdpMembershipAddRequest:
                $ref: "#/components/examples/IdpMembershipAddRequest"
      responses:
        "200":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - A username or group name is missing from the Local IdP
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/users:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - users
      summary: List Directory Users
      operationId: listDirectoryUsers
      description: |
        List Directory Users for Configure → Directory → Users.

        Rows come from each identity store without merging:
        - `idp_user_meta` → `origin=Local`
        - `scim_user_meta` → `origin=Provisioned`
        - `jit_user_meta` → `origin=JIT`
        - metalake-only (`user_meta`, not in IdP, SCIM, or JIT) → `origin` omitted (`null`),
          `enabled=true`, `groups=[]`

        The same username may appear more than once when it exists in multiple stores.
        `enabled` maps to Active / Suspended in the UI (from the identity store for Local /
        Provisioned / JIT). `groups` are identity-store group names for that row's origin.
        `metalakes` are metalake names where the username exists in `user_meta`.
        `canDelete` and `canSuspend` are true only when the caller is a configured service admin
        and the row is a Local user that is not a configured service admin and not the current
        caller (clients do not receive the serviceAdmins list).

      responses:
        "200":
          description: Returns the list of directory users
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryUserListResponse"
              examples:
                DirectoryUserListResponse:
                  $ref: "#/components/examples/DirectoryUserListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - users
      summary: Add Directory User
      operationId: addDirectoryUser
      description: |
        Create a Local Directory User in `idp_user_meta` and add the user to built-in IdP groups.

        Validates that every listed group exists in `idp_group_meta` first, then inserts the user
        (enabled) and writes `idp_user_group_rel` membership rows. Does not create metalake
        `user_meta` rows.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryUserAddRequest"
            examples:
              DirectoryUserAddRequest:
                $ref: "#/components/examples/DirectoryUserAddRequest"

      responses:
        "200":
          description: Returns the created Directory User
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryUserResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - One or more groups do not exist in the built-in IdP
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "409":
          description: Conflict - The username already exists in `idp_user_meta`
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/authn/me:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - authentication
      summary: Get the authenticated enterprise user
      operationId: getExtendedAuthenticatedUser
      description: |
        Enterprise counterpart of OSS `GET /authn/me`. Returns the server-resolved principal
        name and service-administrator status for the current authenticated user, plus:

        - `origins`: every identity-store origin present for that username (`Local` /
          `Provisioned` / `JIT` from `idp_user_meta` / `scim_user_meta` / `jit_user_meta`)
        - `ownedMetalakes`: metalake names for which the user is the USER owner (`owner_meta`)
        - `roles`: lightweight roles keyed by metalake (`name` + `securableObjects` with
          `fullName` / `type` / ALLOW `privileges`)

        Prefer this over hard-coding `origin=Provisioned` for Profile / sidebar identity.

      responses:
        "200":
          description: Returns the authenticated enterprise user information
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedAuthMeResponse"
              examples:
                ExtendedAuthMeResponse:
                  $ref: "#/components/examples/ExtendedAuthMeResponse"
        "401":
          description: Unauthorized - Authentication credentials are missing or invalid
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/users/{user}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/user"
      - name: origin
        in: query
        required: false
        schema:
          type: string
          enum:
            - Local
            - Provisioned
            - JIT
        description: >
          Identity origin of the Directory User (`Local`, `Provisioned`, or `JIT`). Omit for a
          metalake-only user (present in `user_meta` but not in IdP, SCIM, or JIT).
    get:
      tags:
        - users
      summary: Get a Directory User
      operationId: getDirectoryUser
      description: |
        Get one Directory User for Configure → Directory → User Overview.

        `origin`:
        - `Local` → load from `idp_user_meta` (`externalId` omitted)
        - `Provisioned` → load from `scim_user_meta` (`externalId` when present)
        - `JIT` → load from `jit_user_meta` (`externalId` omitted)
        - omitted → metalake-only (`user_meta`, not in IdP, SCIM, or JIT): `origin` omitted,
          `enabled` true, `externalId` omitted. `createTime` is the earliest
          `user_meta.audit_info.createTime` across every metalake row for that username.

        Detail is keyed by (username, origin); cross-store names are not excluded.
        `enabled` maps to Status (Active / Suspended). For Local / Provisioned / JIT, `createTime`
        comes from identity-store `audit_info.createTime`.

      responses:
        "200":
          description: Returns the Directory User detail
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/DirectoryUserDetailResponse"
              examples:
                DirectoryUserDetailResponse:
                  $ref: "#/components/examples/DirectoryUserDetailResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The Directory User does not exist for that origin
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/users/{user}/groups:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/user"
      - name: origin
        in: query
        required: false
        schema:
          type: string
          enum:
            - Local
            - Provisioned
            - JIT
        description: >
          Identity origin of the Directory User (`Local`, `Provisioned`, or `JIT`). Omit for a
          metalake-only user (returns an empty `groups` array after the user exists in `user_meta`
          only).
    get:
      tags:
        - users
      summary: List groups for a Directory User
      operationId: listDirectoryUserGroups
      description: |
        List identity-store groups for Configure → Directory → User → Groups.

        `origin`:
        - `Local` → membership from `idp_user_group_rel` / `idp_group_meta`
        - `Provisioned` → membership from `scim_user_group_rel` / `scim_group_meta`
        - `JIT` → membership from `jit_user_group_rel` / `jit_group_meta`
        - omitted → metalake-only user: empty `groups` array (404 if the name is not metalake-only)

        Each group includes `memberCount` (Members) and `origin` matching the user's identity store.
        `metalakes` is empty on this response. Missing user for that origin returns 404; a user with
        no groups returns an empty `groups` array.

      responses:
        "200":
          description: Returns the Directory User's groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./groups.yaml#/components/schemas/DirectoryGroupListResponse"
              examples:
                DirectoryUserGroupsResponse:
                  $ref: "#/components/examples/DirectoryUserGroupsResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The Directory User does not exist for that origin
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/users/delete:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    post:
      tags:
        - users
      summary: Delete Directory Users
      operationId: deleteDirectoryUsers
      description: |
        Soft-delete Local Directory Users via the built-in IdP (`idp_user_meta` and
        `idp_user_group_rel`).

        Validates that every listed `origin` is `Local` (request field only; no existence check).
        Deleting a configured service admin (`gravitino.authorization.serviceAdmins`) or the
        current caller is rejected with 400. Then soft-deletes each user through the IdP manager.
        Metalake `user_meta` rows are left unchanged.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryUserDeleteRequest"
            examples:
              DirectoryUserDeleteRequest:
                $ref: "#/components/examples/DirectoryUserDeleteRequest"

      responses:
        "200":
          description: Returns the soft-deleted usernames
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/directory/users/enabled:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    put:
      tags:
        - users
      summary: Batch update Directory User enabled
      operationId: batchUpdateDirectoryUserEnabled
      description: |
        Batch-update the `enabled` flag for Local Directory Users (Configure → Directory → Users).

        Validates first that every listed `origin` is `Local` and that every `name` exists in
        `idp_user_meta`. Suspending a configured service admin (`gravitino.authorization.serviceAdmins`)
        or the current caller is rejected with 400. Only then are rows updated in `idp_user_meta`
        (including `audit_info.lastModifier` / `lastModifiedTime`). Otherwise the request fails and
        no user is updated.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectoryUserEnabledBatchUpdateRequest"
            examples:
              DirectoryUserEnabledBatchUpdateRequest:
                $ref: "#/components/examples/DirectoryUserEnabledBatchUpdateRequest"

      responses:
        "200":
          description: Returns the updated usernames
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/users:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - users
      summary: List metalake users for the security UI
      operationId: listUsersWithGroups
      description: |
        List users under a metalake for the enterprise security Users page.

        Returns OSS user fields plus `origin` and metalake `groups`. `origin` is:
        - `Local` when the username exists in `idp_user_meta`
        - `Provisioned` when it exists in `scim_user_meta` (and not IdP)
        - omitted (`null`) when it exists in neither identity store (not inferred as `JIT`)

        `enabled` (Active / Suspended) comes from `idp_user_meta` or `scim_user_meta`, defaulting
        to Active when neither has a row. `externalId` is set for Provisioned users from
        `scim_user_meta` and omitted otherwise. `groups` lists metalake group names for the
        Users table.

      responses:
        "200":
          description: Returns the list of users
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedUserListResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - users
      summary: Add an existing local user into a metalake
      operationId: addSecurityUser
      description: |
        Add an existing built-in IdP user into a metalake for the enterprise security Users page.

        Requires the username to already exist in the built-in IdP. If it does not, returns 404 and
        does not write `user_meta`. If the username is already in `user_meta` for the metalake,
        returns 409. Otherwise creates the metalake `user_meta` row (`enabled` defaults to true /
        Active) and optionally grants metalake roles. This API does not create login credentials.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalUserAddRequest"
            examples:
              LocalUserAddRequest:
                $ref: "#/components/examples/LocalUserAddRequest"

      responses:
        "200":
          description: Returns the metalake user
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedUserResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target metalake or IdP user does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "409":
          description: Conflict - The metalake user already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/users/enabled:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    put:
      tags:
        - users
      summary: Batch update identity-store user enabled status
      operationId: batchUpdateUserEnabled
      description: |
        Batch-update the instance-scoped `enabled` status for users selected through a metalake.
        Every listed username must exist in the target metalake. Users backed by an active
        `scim_user_meta` row are updated there; other users are updated in `idp_user_meta`.
        `user_meta` is not modified.

        Identity-store status is shared across metalakes, so changing a username affects that
        identity wherever it is used. This operation therefore requires `SERVICE_ADMIN`; the
        metalake parameter scopes user validation and selection, not the stored enabled status.

        The update is transactional. Missing metalake returns 404. Missing users or a concurrent
        identity-store change return 400, and no updates are committed.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEnabledBatchUpdateRequest"

      responses:
        "200":
          description: Returns the updated user names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/users/{user}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/user"
    get:
      tags:
        - users
      summary: Get a metalake user for the security UI
      operationId: getSecurityUser
      description: |
        Get a metalake user for the enterprise security user Overview page.

        Returns OSS user fields plus `origin`. `origin` is:
        - `Local` when the username exists in `idp_user_meta`
        - `Provisioned` when it exists in `scim_user_meta` (and not IdP)
        - omitted (`null`) when it exists in neither identity store (not inferred as `JIT`)

        `enabled` (Active / Suspended) comes from `idp_user_meta` or `scim_user_meta`, defaulting
        to Active when neither has a row. `externalId` is set for Provisioned users from
        `scim_user_meta` and omitted otherwise. `auditInfo.createTime` maps to Created on the
        Overview page. `groups` may be empty here; use `listSecurityUserGroups` for membership.

      responses:
        "200":
          description: Returns the user
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ExtendedUserResponse"
        "404":
          description: Not Found - The target metalake or user does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchUserException:
                  $ref: "../../docs/open-api/users.yaml#/components/examples/NoSuchUserException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/users/{user}/groups:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/user"
    get:
      tags:
        - users
      summary: List groups for a metalake user
      operationId: listSecurityUserGroups
      description: |
        List metalake groups the user belongs to for the security user Groups tab.

        Membership comes from the identity store for the user: `idp_user_group_rel` when the
        username exists in `idp_user_meta` (and not SCIM), otherwise `scim_user_group_rel` when it
        exists in `scim_user_meta`.

        Each group includes `origin`:
        - `Local` when the group name exists in `idp_group_meta`
        - `Provisioned` when it exists in `scim_group_meta` (and not IdP)
        - omitted (`null`) when it exists in neither identity store (not inferred as `JIT`)

        Response schema includes `userCount` (Members). This endpoint does not compute membership
        counts; clients may leave Members blank, show `0`, or derive counts elsewhere (for example
        from `listSecurityGroups`).

      responses:
        "200":
          description: Returns the groups
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./groups.yaml#/components/schemas/ExtendedGroupListResponse"
        "404":
          description: Not Found - The target metalake or user does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchUserException:
                  $ref: "../../docs/open-api/users.yaml#/components/examples/NoSuchUserException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/security/metalakes/{metalake}/users/{user}/roles:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/user"
    get:
      tags:
        - users
      summary: List roles assigned to a user
      operationId: listUserRoleAssignments
      description: |
        Returns all roles directly assigned to one metalake user. Each item includes role
        metadata, direct user and group members, the role owner, and audit information
        recorded on the user-role assignment relation. Role privileges are not returned.
      responses:
        "200":
          description: Returns the user's role assignments
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./authorization.yaml#/components/schemas/RoleAssignmentDetailsListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or user does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchUserException:
                  $ref: "../../docs/open-api/users.yaml#/components/examples/NoSuchUserException"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    IdentitySource:
      type: string
      description: |
        Source of the identity. Serialized as `origin`.

        - `Local`: name exists in the built-in IdP (`idp_user_meta` / `idp_group_meta`)
        - `Provisioned`: name exists in SCIM (`scim_user_meta` / `scim_group_meta`) and not IdP
        - `JIT`: reserved for write-time JWT discovery; metalake list/get no longer infer JIT from
          absence in IdP/SCIM (those rows omit `origin`)
      enum:
        - Local
        - Provisioned
        - JIT

    IdpMembershipAddRequest:
      type: object
      required:
        - usernames
        - groupNames
      properties:
        usernames:
          type: array
          minItems: 1
          description: Local IdP usernames to add to each listed group
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[^:]*$"
        groupNames:
          type: array
          minItems: 1
          description: Local IdP group names that each listed user should join
          items:
            type: string
            minLength: 1
            maxLength: 128

    IdpPasswordChangeRequest:
      type: object
      required:
        - username
        - oldPassword
        - newPassword
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^:]*$"
          description: Local IdP username whose password will be changed
        oldPassword:
          type: string
          minLength: 1
          description: Current plaintext password (verified before update)
        newPassword:
          type: string
          minLength: 12
          maxLength: 64
          description: New plaintext password (hashed before storage)

    IdentityType:
      type: string
      description: Identity type for user or group lookup before add
      enum:
        - local
        - provisioned

    UserGroupNamesResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        username:
          type: string
          description: Looked-up username
        type:
          $ref: "#/components/schemas/IdentityType"
        groupNames:
          type: array
          description: Group names for the user
          items:
            type: string

    ExtendedUser:
      allOf:
        - $ref: "../../docs/open-api/users.yaml#/components/schemas/User"
        - type: object
          required:
            - groups
            - enabled
          properties:
            origin:
              type: string
              nullable: true
              allOf:
                - $ref: "#/components/schemas/IdentitySource"
              description: >
                Identity source when known. Omitted when the name matches neither IdP nor SCIM.
            groups:
              type: array
              description: >
                Metalake group names for the security Users table. Populated by list users; may be
                empty on get user and group-membership responses.
              items:
                type: string
            enabled:
              type: boolean
              description: >
                Identity-store enabled flag (Active / Suspended). From `idp_user_meta` or
                `scim_user_meta`, defaulting to true when neither has a row.
            externalId:
              type: string
              nullable: true
              description: SCIM externalId when Provisioned; omitted otherwise

    ExtendedUserListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        users:
          type: array
          description: A list of users with origin for the security UI
          items:
            $ref: "#/components/schemas/ExtendedUser"

    UserEnabledBatchUpdateRequest:
      type: object
      required:
        - users
        - enabled
      properties:
        users:
          type: array
          items:
            type: string
          description: User names to update under the metalake
        enabled:
          type: boolean
          description: Target enabled value for all listed users

    LocalUserAddRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^:]*$"
          description: >
            The username to add to the metalake. Must already exist in the built-in IdP.
        roles:
          type: array
          items:
            type: string
            minLength: 1
          description: Optional metalake roles to grant to the user
        enabled:
          type: boolean
          description: Metalake user enabled flag; defaults to true (Active)

    ExtendedUserResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        user:
          $ref: "#/components/schemas/ExtendedUser"

    ExtendedAuthMeResponse:
      type: object
      required:
        - code
        - principal
        - serviceAdmin
        - origins
        - ownedMetalakes
        - roles
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        principal:
          type: string
          description: The server-resolved principal name of the authenticated user
        serviceAdmin:
          type: boolean
          description: Whether the authenticated user is a Gravitino service administrator
        origins:
          type: array
          description: Identity-store origins present for the user
          items:
            $ref: "#/components/schemas/IdentitySource"
        ownedMetalakes:
          type: array
          description: Metalake names for which the user is the USER owner
          items:
            type: string
        roles:
          type: object
          description: >
            Direct roles keyed by metalake name. Each entry is a lightweight role with `name`
            and `securableObjects` (`fullName`, `type`, ALLOW `privileges`). DENY is omitted.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AuthMeRole"

    AuthMeRole:
      type: object
      required:
        - name
        - securableObjects
      properties:
        name:
          type: string
          description: Role name
        securableObjects:
          type: array
          description: Securable objects granted to the role (ALLOW privileges only)
          items:
            $ref: "#/components/schemas/AuthMeSecurableObject"

    AuthMeSecurableObject:
      type: object
      required:
        - fullName
        - type
        - privileges
      properties:
        fullName:
          type: string
          description: Metadata object full name (e.g. catalog, catalog.schema.table)
        type:
          type: string
          description: Metadata object type
          enum:
            - METALAKE
            - CATALOG
            - SCHEMA
            - TABLE
            - COLUMN
            - FILESET
            - TOPIC
            - MODEL
            - FUNCTION
            - VIEW
            - TAG
            - POLICY
            - JOB
            - JOB_TEMPLATE
        privileges:
          type: array
          description: Distinct ALLOW privilege names on this object
          items:
            type: string

    DirectoryUserDTO:
      type: object
      required:
        - name
        - enabled
        - groups
        - metalakes
        - canDelete
        - canSuspend
      properties:
        name:
          type: string
          description: Username
        enabled:
          type: boolean
          description: Whether the user is enabled (Active / Suspended in the UI)
        origin:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IdentitySource"
          description: >
            Identity source when known. Omitted when the name is metalake-only (not in IdP, SCIM,
            or JIT).
        groups:
          type: array
          description: Identity-store group names
          items:
            type: string
        metalakes:
          type: array
          description: Metalake names containing this username
          items:
            type: string
        canDelete:
          type: boolean
          description: >
            Whether the caller may delete this user. True only when the caller is a configured
            service admin and the row is a Local user that is not a configured service admin and
            not the current caller.
        canSuspend:
          type: boolean
          description: >
            Whether the caller may suspend this user. Same rule as `canDelete`.

    DirectoryUserListResponse:
      type: object
      required:
        - code
        - users
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
        users:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryUserDTO"

    DirectoryUserEnabledBatchUpdateRequest:
      type: object
      required:
        - users
        - enabled
      properties:
        users:
          type: array
          minItems: 1
          description: Directory users to update; every origin must be Local
          items:
            $ref: "#/components/schemas/DirectoryUserEnabledUpdate"
        enabled:
          type: boolean
          description: Target enabled value for all listed users

    DirectoryUserEnabledUpdate:
      type: object
      required:
        - name
        - origin
      properties:
        name:
          type: string
          description: Username
        origin:
          $ref: "#/components/schemas/IdentitySource"

    DirectoryUserDeleteRequest:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          minItems: 1
          description: Directory users to delete; every origin must be Local
          items:
            $ref: "#/components/schemas/DirectoryUserDelete"

    DirectoryUserDelete:
      type: object
      required:
        - name
        - origin
      properties:
        name:
          type: string
          description: Username
        origin:
          $ref: "#/components/schemas/IdentitySource"

    DirectoryUserAddRequest:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^:]*$"
          description: Username to create in idp_user_meta
        password:
          type: string
          minLength: 12
          maxLength: 64
          description: Plaintext password (hashed before storage)
        groupNames:
          type: array
          description: Built-in IdP group names to join
          items:
            type: string
            minLength: 1
            maxLength: 128

    DirectoryUserResponse:
      type: object
      required:
        - code
        - user
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        user:
          $ref: "#/components/schemas/DirectoryUserDTO"

    DirectoryUserDetailDTO:
      type: object
      required:
        - name
        - enabled
      properties:
        name:
          type: string
          description: Username
        enabled:
          type: boolean
          description: Whether the user is enabled (Active / Suspended in the UI)
        origin:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/IdentitySource"
          description: >
            Omitted for metalake-only users (not in IdP, SCIM, or JIT).
        externalId:
          type: string
          nullable: true
          description: SCIM externalId when Provisioned; omitted for Local and metalake-only
        createTime:
          type: string
          format: date-time
          nullable: true
          description: >
            Created on Overview. Local / Provisioned / JIT: identity-store `audit_info.createTime`.
            Metalake-only: earliest `user_meta.audit_info.createTime` across metalakes.
            Omitted when audit data is unavailable.

    DirectoryUserDetailResponse:
      type: object
      required:
        - code
        - user
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        user:
          $ref: "#/components/schemas/DirectoryUserDetailDTO"

  examples:
    ExtendedAuthMeResponse:
      value: {
        "code": 0,
        "principal": "sai",
        "serviceAdmin": false,
        "origins": ["Local", "JIT"],
        "ownedMetalakes": ["metalake1"],
        "roles": {
          "metalake1": [
            {
              "name": "admin",
              "securableObjects": [
                {
                  "fullName": "catalog1",
                  "type": "CATALOG",
                  "privileges": ["USE_CATALOG"]
                }
              ]
            }
          ],
          "metalake2": []
        }
      }

    LocalUserAddRequest:
      value:
        name: jordan.reyes
        roles:
          - Analyst
        enabled: true

    DirectoryUserAddRequest:
      value:
        name: jordan.m
        password: "ChangeMe-2026!"
        groupNames:
          - governance
          - ops

    DirectoryUserEnabledBatchUpdateRequest:
      value:
        users:
          - name: lee.p
            origin: Local
          - name: sam.o
            origin: Local
        enabled: false

    DirectoryUserDeleteRequest:
      value:
        users:
          - name: lee.p
            origin: Local
          - name: sam.o
            origin: Local

    DirectoryUserListResponse:
      value:
        code: 0
        users:
          - name: dana.k
            enabled: true
            origin: Provisioned
            groups:
              - finance
            metalakes:
              - Acme
              - Contoso
            canDelete: false
            canSuspend: false
          - name: lee.p
            enabled: false
            origin: Local
            groups: []
            metalakes:
              - Acme
            canDelete: true
            canSuspend: true
          - name: sam.o
            enabled: true
            origin: Local
            groups:
              - governance
              - ops
              - security
            metalakes:
              - Contoso
            canDelete: true
            canSuspend: true

    DirectoryUserDetailResponse:
      value:
        code: 0
        user:
          name: dana.k
          enabled: true
          origin: Provisioned
          externalId: 51d2e02d-7e1f-49e4-e7cb-7da2050dcb3b
          createTime: "2025-09-14T00:00:00Z"

    DirectoryUserGroupsResponse:
      value:
        code: 0
        groups:
          - name: finance
            memberCount: 3
            origin: Provisioned
            metalakes: []
          - name: platform
            memberCount: 1
            origin: Provisioned
            metalakes: []

    IdpMembershipAddRequest:
      value:
        usernames:
          - sam.o
          - lee.p
        groupNames:
          - governance
          - ops

    IdpPasswordChangeRequest:
      value:
        username: dana.k
        oldPassword: "ChangeMe-2026!"
        newPassword: "ChangeMe-2027!"
