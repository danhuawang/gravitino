---

paths:

  /web/entities:
    get:
      tags:
        - entity
      summary: List entities
      operationId: listEntities
      description: |
        List entities under the specified namespace, this endpoint is used for display tree in Web UI.
      parameters:
        - name: namespace
          in: query
          description: The namespace of the entity
          required: true
          schema:
            type: string
        - name: catalogType
          in: query
          description: The catalog type of the entity
          required: false
          schema:
            type: string
        - name: parentSchema
          in: query
          description: |
            Optional hierarchical parent schema used when listing entities.
            When namespace is the catalog namespace (metalake.catalog), returns
            child schemas under the provided parent schema.
            When namespace is the schema namespace (metalake.catalog.schema),
            returns tables along with child schemas under the parent schema.
          required: false
          schema:
            type: string
        - name: resultLimit
          in: query
          description: The maximum number of entities to return
          required: false
          schema:
            type: integer
            format: int32
            default: 1000
      responses:
        "200":
          description: Returns the list of entities under the specified namespace
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CatalogListResponse"
                  - $ref: "#/components/schemas/SchemaListResponse"
                  - $ref: "#/components/schemas/TableListResponse"
                  - $ref: "#/components/schemas/FilesetListResponse"
                  - $ref: "#/components/schemas/TopicListResponse"
                  - $ref: "#/components/schemas/ModelListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    ExtendedCatalog:
      allOf:
        - $ref: "../../docs/open-api/catalogs.yaml#/components/schemas/Catalog"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"
            directChildCounts:
              type: integer
              format: int64
              minimum: 0
              nullable: true
              description: The visible direct schema count, or null when the count is unavailable

    ExtendedSchema:
      allOf:
        - $ref: "../../docs/open-api/schemas.yaml#/components/schemas/Schema"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"
            directChildCounts:
              type: integer
              format: int64
              minimum: 0
              nullable: true
              description: The visible direct entity count, or null when the count is unavailable

    ExtendedTable:
      allOf:
        - $ref: "../../docs/open-api/tables.yaml#/components/schemas/Table"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    ExtendedFileset:
      allOf:
        - $ref: "../../docs/open-api/filesets.yaml#/components/schemas/Fileset"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    ExtendedTopic:
      allOf:
        - $ref: "../../docs/open-api/topics.yaml#/components/schemas/Topic"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    ExtendedModel:
      allOf:
        - $ref: "../../docs/open-api/models.yaml#/components/schemas/Model"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    ExtendedFunction:
      allOf:
        - $ref: "../../docs/open-api/functions.yaml#/components/schemas/Function"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    ExtendedView:
      allOf:
        - $ref: "../../docs/open-api/views.yaml#/components/schemas/View"
        - type: object
          properties:
            tags:
              type: array
              description: Associated tags
              items:
                $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
            policies:
              type: array
              description: Associated policies
              items:
                $ref: "../../docs/open-api/policies.yaml#/components/schemas/Policy"

    CatalogListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        catalogs:
          type: array
          description: A list of extended catalog objects
          items:
            $ref: "#/components/schemas/ExtendedCatalog"

    SchemaListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        schemas:
          type: array
          description: A list of extended schema objects
          items:
            $ref: "#/components/schemas/ExtendedSchema"

    TableListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        tables:
          type: array
          description: A list of extended table objects
          items:
            $ref: "#/components/schemas/ExtendedTable"
        functions:
          type: array
          description: A list of extended function objects
          items:
            $ref: "#/components/schemas/ExtendedFunction"
        views:
          type: array
          description: A list of extended view objects
          items:
            $ref: "#/components/schemas/ExtendedView"
        schemas:
          type: array
          description: A list of extended child schema objects for hierarchical schema support
          items:
            $ref: "#/components/schemas/ExtendedSchema"

    FilesetListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        filesets:
          type: array
          description: A list of extended fileset objects
          items:
            $ref: "#/components/schemas/ExtendedFileset"
        functions:
          type: array
          description: A list of extended function objects
          items:
            $ref: "#/components/schemas/ExtendedFunction"

    TopicListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        topics:
          type: array
          description: A list of extended topic objects
          items:
            $ref: "#/components/schemas/ExtendedTopic"
        functions:
          type: array
          description: A list of extended function objects
          items:
            $ref: "#/components/schemas/ExtendedFunction"

    ModelListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        models:
          type: array
          description: A list of extended model objects
          items:
            $ref: "#/components/schemas/ExtendedModel"
        functions:
          type: array
          description: A list of extended function objects
          items:
            $ref: "#/components/schemas/ExtendedFunction"
