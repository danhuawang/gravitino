---
openapi: 3.0.3
info:
  title: Datastrato SCIM Token Admin REST API
  version: 1.3.1-SNAPSHOT
  description: |
    **Gravitino Enterprise only.** These APIs require a valid Gravitino Enterprise
    license and the `scim` plugin.

    OpenAPI specification for SCIM integration token administration APIs exposed
    by the `scim` plugin on the main Gravitino REST server (port 8090).

    Enable the token admin API by registering
    `com.datastrato.gravitino.scim.web.rest.feature` in
    `gravitino.server.rest.extensionPackages`.

    These are **internal APIs** served under `/api/internal`. They are used by the
    Gravitino Enterprise Web UI, are not part of the public REST API, and may change
    without notice. Requests must include the `X-Gravitino-Internal-Origin` header;
    requests without it are rejected with HTTP 400.

    All endpoints require main-server authentication, and the caller must be a
    service admin listed in `gravitino.authorization.serviceAdmins`. Plaintext token
    values are returned only in create and rotate responses.

servers:
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable.
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: http
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "8090"
      basePath:
        description: Optional prefix to be appended to all routes
        default: "api"

security:
  - OAuth2WithJWT: [serviceAudience]
  - BasicAuth: []

paths:
  /internal/scim/provisioning:
    $ref: "./scim-tokens.yaml#/paths/~1internal~1scim~1provisioning"

  /internal/scim/tokens:
    $ref: "./scim-tokens.yaml#/paths/~1internal~1scim~1tokens"

  /internal/scim/tokens/overview:
    $ref: "./scim-tokens.yaml#/paths/~1internal~1scim~1tokens~1overview"

  /internal/scim/tokens/{tokenName}/rotate:
    # escape the path name by replacing `{ }` with `%7B %7D`
    $ref: "./scim-tokens.yaml#/paths/~1internal~1scim~1tokens~1%7BtokenName%7D~1rotate"

  /internal/scim/tokens/{tokenName}:
    # escape the path name by replacing `{ }` with `%7B %7D`
    $ref: "./scim-tokens.yaml#/paths/~1internal~1scim~1tokens~1%7BtokenName%7D"

components:
  securitySchemes:
    OAuth2WithJWT:
      $ref: "../../../docs/open-api/openapi.yaml#/components/securitySchemes/OAuth2WithJWT"
    BasicAuth:
      $ref: "../../../docs/open-api/openapi.yaml#/components/securitySchemes/BasicAuth"
