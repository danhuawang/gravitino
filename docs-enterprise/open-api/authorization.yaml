---

paths:

  /web/security/metalakes/{metalake}/objects/roles:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: List metadata objects with role privileges
      operationId: listObjectRolePrivileges
      description: |
        Lists metadata objects under a metalake that have role privilege bindings,
        together with each object's associated roles and privileges. Each role also
        includes its creation time and direct user-plus-group assignment count.
      responses:
        "200":
          description: Returns metadata objects grouped with their role privileges
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ObjectRolePrivilegeListResponse"
              examples:
                ObjectRolePrivilegeListResponse:
                  $ref: "#/components/examples/ObjectRolePrivilegeListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/roles:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: List role summaries
      operationId: listRoleSummaries
      description: |
        Lists all roles visible to the caller, together with each role's owner,
        creation time, direct user and group counts, and their sum as assignCount.
        Users contained in an assigned group are not included in the user count.
      responses:
        "200":
          description: Returns all visible role summaries
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/RoleSummaryListResponse"
              examples:
                RoleSummaryListResponse:
                  $ref: "#/components/examples/RoleSummaryListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/security/metalakes/{metalake}/authorization/overview:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: Get the metalake authorization overview
      operationId: getAuthorizationOverview
      description: |
        Returns summary card counts, metadata objects grouped by catalog, users and
        groups associated through roles, privileged principal share, and all visible
        roles with their direct members.

        Summary includes active/suspended users, empty groups, and unassigned roles.

        A member is one directly assigned user or group; users contained in a group
        are not expanded. Privileged is the share of catalog principals holding an allowed
        write or admin privilege; denied and read-only privileges are excluded.
      responses:
        "200":
          description: Returns the authorization overview
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/AuthorizationOverviewResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:

  schemas:

    MetadataObject:
      type: object
      description: A metadata object
      required:
        - fullName
        - type
      properties:
        fullName:
          type: string
          description: The full name of the metadata object
        type:
          type: string
          description: The type of the metadata object
          enum:
            - "METALAKE"
            - "CATALOG"
            - "SCHEMA"
            - "FILESET"
            - "TABLE"
            - "VIEW"
            - "TOPIC"
            - "COLUMN"
            - "ROLE"
            - "MODEL"
            - "TAG"
            - "POLICY"
            - "JOB"
            - "JOB_TEMPLATE"
            - "FUNCTION"

    RolePrivilege:
      type: object
      required:
        - role
        - privileges
        - createTime
        - assignCount
      properties:
        role:
          type: string
          description: The role name
        privileges:
          type: array
          description: The privileges granted to the role
          items:
            $ref: "../../docs/open-api/roles.yaml#/components/schemas/Privilege"
        createTime:
          type: string
          format: date-time
          description: The role creation time
        assignCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of users and groups directly assigned to the role

    ObjectRolePrivilege:
      type: object
      required:
        - metadataObject
        - rolePrivileges
      properties:
        metadataObject:
          $ref: "#/components/schemas/MetadataObject"
        rolePrivileges:
          type: array
          description: The role privileges associated with the metadata object
          items:
            $ref: "#/components/schemas/RolePrivilege"

    ObjectAuthorization:
      type: object
      required:
        - metadataObject
        - rolePrivileges
      properties:
        metadataObject:
          $ref: "#/components/schemas/MetadataObject"
        rolePrivileges:
          type: array
          description: Explicit role privileges associated with the metadata object
          items:
            $ref: "#/components/schemas/RolePrivilege"

    RoleAssignment:
      type: object
      required:
        - role
        - assignmentAudit
      properties:
        role:
          $ref: "../../docs/open-api/roles.yaml#/components/schemas/Role"
        assignmentAudit:
          $ref: "../../docs/open-api/openapi.yaml#/components/schemas/Audit"

    CatalogAuthorization:
      type: object
      required:
        - catalog
        - objects
        - roles
        - users
        - groups
        - memberCount
        - privilegedPrincipalCount
        - privileged
      properties:
        catalog:
          type: string
          description: The catalog name
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ObjectAuthorization"
        roles:
          type: array
          items:
            type: string
        users:
          type: array
          description: Distinct users associated with the catalog through its roles
          items:
            type: string
        groups:
          type: array
          description: Distinct groups associated with the catalog through its roles
          items:
            type: string
        memberCount:
          type: integer
          format: int32
          description: Distinct user count plus distinct group count for the catalog
        privilegedPrincipalCount:
          type: integer
          format: int32
          description: Number of distinct catalog principals holding an allowed write or admin privilege
        privileged:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of catalog principals holding an allowed write or admin privilege

    RoleMembership:
      type: object
      required:
        - role
        - users
        - groups
        - userCount
        - groupCount
        - memberCount
        - assigned
        - catalogs
        - objectCount
        - privilegeCount
      properties:
        role:
          type: string
        users:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        userCount:
          type: integer
          format: int32
        groupCount:
          type: integer
          format: int32
        memberCount:
          type: integer
          format: int32
          description: Direct user assignments plus direct group assignments
        assigned:
          type: boolean
          description: Whether the role is assigned to at least one user or group
        catalogs:
          type: array
          items:
            type: string
        objectCount:
          type: integer
          format: int32
          description: Number of objects with explicit privileges in the role
        privilegeCount:
          type: integer
          format: int32
          description: Number of explicit privilege entries in the role

    RoleSummary:
      type: object
      required:
        - role
        - owner
        - createTime
        - userCount
        - groupCount
        - assignCount
      properties:
        role:
          type: string
          description: The role name
        owner:
          type: object
          nullable: true
          description: The role owner, or null when no owner is assigned
          allOf:
            - $ref: "../../docs/open-api/owners.yaml#/components/schemas/Owner"
        createTime:
          type: string
          format: date-time
          description: The role creation time
        userCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of users directly assigned to the role
        groupCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of groups directly assigned to the role
        assignCount:
          type: integer
          format: int32
          minimum: 0
          description: Direct user assignment count plus direct group assignment count

    ObjectRolePrivilegeListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        objectRolePrivileges:
          type: array
          description: Metadata objects with their associated role privileges
          items:
            $ref: "#/components/schemas/ObjectRolePrivilege"

    AuthorizationSummary:
      type: object
      required:
        - userCount
        - activeUserCount
        - suspendedUserCount
        - groupCount
        - emptyGroupCount
        - roleCount
        - unassignedRoleCount
      properties:
        userCount:
          type: integer
          format: int32
          description: Total metalake users
        activeUserCount:
          type: integer
          format: int32
          description: Users with enabled=true
        suspendedUserCount:
          type: integer
          format: int32
          description: Users with enabled=false
        groupCount:
          type: integer
          format: int32
          description: Total metalake groups
        emptyGroupCount:
          type: integer
          format: int32
          description: Groups with zero member users
        roleCount:
          type: integer
          format: int32
          description: Visible roles included in the overview
        unassignedRoleCount:
          type: integer
          format: int32
          description: Visible roles with no user or group member

    RoleAssignmentListResponse:
      type: object
      required:
        - code
        - roles
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        roles:
          type: array
          description: Roles and their principal-assignment audit information
          items:
            $ref: "#/components/schemas/RoleAssignment"

    RoleSummaryListResponse:
      type: object
      required:
        - code
        - roles
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 0
        roles:
          type: array
          description: All roles visible to the caller
          items:
            $ref: "#/components/schemas/RoleSummary"

    AuthorizationOverviewResponse:
      type: object
      required:
        - code
        - summary
        - catalogs
        - roles
        - unassignedRoles
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 0
        summary:
          $ref: "#/components/schemas/AuthorizationSummary"
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogAuthorization"
        roles:
          type: array
          description: All visible roles, including roles with no members
          items:
            $ref: "#/components/schemas/RoleMembership"
        unassignedRoles:
          type: array
          description: Roles that are not assigned to a user or group
          items:
            type: string

  examples:

    RoleSummaryListResponse:
      value:
        code: 0
        roles:
          - role: admin
            owner:
              name: alice
              type: USER
            createTime: "2026-08-26T01:02:03Z"
            userCount: 2
            groupCount: 1
            assignCount: 3

    ObjectRolePrivilegeListResponse:
      value: {
        "code": 0,
        "objectRolePrivileges": [
          {
            "metadataObject": {
              "fullName": "catalog1.schema1.table1",
              "type": "TABLE"
            },
            "rolePrivileges": [
              {
                "role": "role1",
                "createTime": "2026-08-26T01:02:03Z",
                "assignCount": 3,
                "privileges": [
                  {
                    "name": "SELECT_TABLE",
                    "condition": "ALLOW"
                  }
                ]
              },
              {
                "role": "role2",
                "createTime": "2026-08-27T01:02:03Z",
                "assignCount": 1,
                "privileges": [
                  {
                    "name": "SELECT_TABLE",
                    "condition": "DENY"
                  }
                ]
              }
            ]
          }
        ]
      }
