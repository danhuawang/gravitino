---

paths:
  /internal/search/query:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - search
      summary: Search metadata
      operationId: searchEntities
      description: |
        Searches metadata in a metalake. The keyword can contain free text and filters such as
        `catalog_name:catalog`, `entity_type:TABLE`, and `tag_name:tag`. Results are grouped by
        entity type, and pagination is applied independently to each group.
        Terms containing hyphens and double-quoted terms use case-insensitive literal substring
        matching. For example, `c-d` matches `ac-db` but not `ac_db`. `-name:ac-db` is a negated
        exact-name filter, while `-d` is a literal term. `name` is an alias for `entity_name`.
        Invalid query syntax returns 400. Literal search reuses existing keyword subfields without
        requiring a template upgrade or index rebuild. Fields without a keyword subfield and
        field values longer than 256 characters are excluded from literal matching. Leading
        wildcard queries require search.allow_expensive_queries=true.
        When authorization is enabled, the caller must be a member of the requested metalake,
        including service administrators. Results are filtered using the caller's current entity
        permissions before pagination. Each group contains only authorized matches, and `totalSize`
        counts all authorized matches of that type. Computing these totals authorizes the matching
        index entries in batches, up to a configured per-entity-type limit
        (`gravitino.datastrato.search.maxAuthorizationScanSize`, 10000 by default). A group whose
        matches exceed that limit sets `totalSizeTruncated`, and its remaining matches are neither
        returned nor counted; narrow the query to see them. Such a group is returned even when none
        of the authorized entries were visible, so an empty group with `totalSizeTruncated` set
        means "narrow the query", not "nothing matched". Authorization or filtered-query failures
        return a server error.
      parameters:
        - name: metalake
          in: query
          description: The name of the metalake to search
          required: true
          schema:
            type: string
        - name: keyword
          in: query
          description: The free-text query and optional search filters. Omit it to list all indexed metadata.
          required: false
          schema:
            type: string
        - name: pageNumber
          in: query
          description: The zero-based page number for each entity-type group
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          description: The maximum number of entities returned in each entity-type group
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
      responses:
        "200":
          description: Returns matching metadata grouped by entity type.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/SearchQueryResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: |-
            The caller is not a member of the requested metalake. The membership check runs before
            the metalake is resolved, so a non-member receives this status for an unknown metalake
            as well and cannot use the endpoint to discover which metalakes exist.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "404":
          description: |-
            The requested metalake does not exist. When authorization is enabled this is returned
            only to members of the metalake; other callers receive 403.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/search/rebuild/metalakes/{metalake}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    post:
      tags:
        - search
      summary: Rebuild a metalake search index
      operationId: rebuildSearchIndex
      description: |
        Starts an asynchronous rebuild of all search indexes for the specified metalake. Use the
        returned task identifier with the task-status endpoint to monitor the rebuild.
        When authorization is enabled, only service administrators or the target metalake owner
        may submit a rebuild. Service administrators need not be members of the metalake.
      parameters:
        - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      responses:
        "200":
          description: Returns the identifier of the submitted rebuild task
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/SyncMetadataResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: The caller is neither a service administrator nor the target metalake owner
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/search/sync/metalakes/{metalake}/objects:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    post:
      tags:
        - search
      summary: Synchronize metadata with the search index
      operationId: syncMetadataObjects
      description: |
        Starts an asynchronous search-index synchronization for a metadata object. Set both
        `metadataType` and `metadataFullName` to synchronize a specific object. Omit both fields,
        or send an empty JSON object, to synchronize all metadata in the metalake. Use the returned
        task identifier with the task-status endpoint to monitor the synchronization.
        When authorization is enabled, only service administrators or the target metalake owner
        may submit synchronization. Service administrators need not be members of the metalake.
      parameters:
        - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
      requestBody:
        description: |-
          The object to synchronize and whether its descendants should also be synchronized. Send an
          empty JSON object (`{}`) to synchronize all metadata in the metalake.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncMetadataRequest"
      responses:
        "200":
          description: Returns the identifier of the submitted synchronization task
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/SyncMetadataResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: The caller is neither a service administrator nor the target metalake owner
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /internal/search/task/{taskId}/status:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/InternalOriginHeader"
    get:
      tags:
        - search
      summary: Get a search task status
      operationId: getSearchTaskStatus
      description: |
        Returns the current status of an asynchronous search-index task. The status names the
        metalake and the metadata object of the task, so when authorization is enabled reading it
        requires the same permission as submitting one: a service administrator or the owner of
        the task's metalake.
      parameters:
        - name: taskId
          in: path
          description: The identifier returned when the asynchronous task was submitted
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns the current task status
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: The caller is neither a service administrator nor the owner of the task's metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5XX":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    SearchQueryResponse:
      type: object
      description: Metadata search results grouped by entity type
      required:
        - code
        - entities
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        entities:
          type: array
          description: The result groups that contain matches
          items:
            $ref: "#/components/schemas/SearchResultGroup"

    SearchResultGroup:
      type: object
      description: Search results for one entity type
      required:
        - totalSize
        - type
        - entities
      properties:
        totalSize:
          type: integer
          format: int32
          minimum: 0
          description: The total number of matches for this entity type before pagination; only authorized matches are counted when authorization is enabled
        totalSizeTruncated:
          type: boolean
          default: false
          description: |-
            Whether the matches of this entity type reached the authorization scan limit. When true,
            `totalSize` is a lower bound rather than the exact number of authorized matches.
        type:
          $ref: "#/components/schemas/SearchEntityType"
        entities:
          type: array
          description: The requested page of matching entities
          items:
            $ref: "#/components/schemas/SearchEntity"

    SearchEntityType:
      type: string
      description: The type of a searchable metadata entity
      enum:
        - job_template
        - catalog
        - schema
        - table
        - view
        - function
        - fileset
        - topic
        - model
        - tag
        - policy
        - user
        - group
        - role

    SearchEntity:
      type: object
      description: |
        An indexed metadata entity. `provider` and `type` are returned for catalogs; `columns` is
        returned for tables and views; `latest_version` and `model_versions` are returned for
        models; and `policy_type`, `enabled`, and `content` are returned for policies.
      required:
        - entityId
        - entityType
        - inUse
        - metalake
        - entityName
        - updateTime
      properties:
        entityId:
          type: integer
          format: int64
          description: The unique identifier of the entity
        entityType:
          $ref: "#/components/schemas/SearchEntityType"
        inUse:
          type: boolean
          description: Whether the entity is currently in use
        metalake:
          type: string
          description: The metalake that contains the entity
        entityName:
          type: string
          description: The name of the entity
        entityComment:
          type: string
          description: The comment associated with the entity
        catalogName:
          type: string
          description: The catalog that contains the entity, when applicable
        fullQualifiedName:
          type: string
          description: The fully qualified name of the entity
        tags:
          type: array
          description: Tags associated with the entity
          items:
            $ref: "#/components/schemas/SearchTag"
        policyNames:
          type: array
          description: Names of policies associated with the entity
          items:
            type: string
        searchAudit:
          $ref: "#/components/schemas/SearchAudit"
        owner:
          type: string
          description: The owner of the entity
        userPermissions:
          type: array
          description: User permissions projected into the search index
          items:
            $ref: "#/components/schemas/SearchPermission"
        rolePermissions:
          type: array
          description: Role permissions projected into the search index
          items:
            $ref: "#/components/schemas/SearchPermission"
        entityProperties:
          type: array
          description: |
            Entity properties represented as key-value pairs. Catalog properties are omitted
            because they may contain credentials.
          items:
            $ref: "#/components/schemas/SearchProperty"
        updateTime:
          type: integer
          format: int64
          description: The last index update time in milliseconds since the Unix epoch
        provider:
          type: string
          description: The provider of a catalog entity
        type:
          type: string
          description: The catalog type of a catalog entity
          enum:
            - relational
            - fileset
            - messaging
            - model
        columns:
          type: array
          description: Columns of a table or view entity
          items:
            $ref: "#/components/schemas/SearchColumn"
        latest_version:
          type: integer
          format: int32
          description: The latest version number of a model entity
        model_versions:
          type: array
          description: Versions of a model entity
          items:
            $ref: "#/components/schemas/SearchModelVersion"
        policy_type:
          type: string
          description: The type of a policy entity
        enabled:
          type: boolean
          description: Whether a policy entity is enabled
        content:
          type: string
          description: The serialized content of a policy entity

    SearchTag:
      type: object
      description: A tag projected into a search entity
      required:
        - tagName
      properties:
        tagName:
          type: string
          description: The name of the tag
        tagComment:
          type: string
          description: The comment associated with the tag
        properties:
          type: object
          description: Tag properties
          additionalProperties:
            type: string

    SearchAudit:
      type: object
      description: Audit information projected into a search entity
      properties:
        createTime:
          type: string
          description: The ISO-8601 local date-time when the entity was created
        creator:
          type: string
          description: The principal that created the entity
        lastModifiedTime:
          type: string
          description: The ISO-8601 local date-time when the entity was last modified
        lastModifier:
          type: string
          description: The principal that last modified the entity

    SearchPermission:
      type: object
      description: A user or role permission projected into a search entity
      required:
        - name
      properties:
        name:
          type: string
          description: The user or role name
        permission:
          type: string
          description: The serialized permission value

    SearchProperty:
      type: object
      description: A search entity property
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: The property key
        value:
          type: string
          description: The property value

    SearchColumn:
      type: object
      description: A table or view column projected into a search entity
      required:
        - columnName
      properties:
        columnName:
          type: string
          description: The name of the column
        columnComment:
          type: string
          description: The comment associated with the column

    SearchModelVersion:
      type: object
      description: A version of a model projected into a search entity
      required:
        - version
        - uri
        - aliases
      properties:
        version:
          type: integer
          format: int32
          description: The model version number
        uri:
          type: array
          description: Artifact URIs for this model version
          items:
            type: string
        aliases:
          type: array
          description: Aliases assigned to this model version
          items:
            type: string

    SyncMetadataRequest:
      type: object
      description: |
        A metadata synchronization request. `metadataType` and `metadataFullName` must either both
        be set or both be omitted.
      oneOf:
        - required:
            - metadataFullName
            - metadataType
        - not:
            anyOf:
              - required:
                  - metadataFullName
              - required:
                  - metadataType
      properties:
        metadataFullName:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          description: The dot-separated full name of the metadata object
        metadataType:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          description: |
            The case-insensitive metadata type. Supported values are metalake, catalog, schema,
            table, view, function, fileset, topic, model, tag, policy, and role.
        cascade:
          type: boolean
          default: false
          description: Whether to synchronize descendant metadata objects

    SyncMetadataResponse:
      type: object
      description: The response returned after submitting an asynchronous search task
      required:
        - code
        - taskId
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        taskId:
          type: string
          description: The identifier of the submitted task

    TaskStatusResponse:
      type: object
      description: The response containing the current state of a search task
      required:
        - code
        - taskStatus
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        taskStatus:
          $ref: "#/components/schemas/SearchTaskStatus"

    SearchTaskStatus:
      type: object
      description: The state and details of an asynchronous search task
      required:
        - taskId
        - subTaskNum
        - taskStatus
        - metalake
        - cascade
      properties:
        taskId:
          type: string
          description: The task identifier
        subTaskNum:
          type: integer
          format: int32
          minimum: 0
          description: The number of subtasks created for this task
        taskStatus:
          type: string
          description: |-
            The current state of the task. `COMPLETED` is terminal but does not guarantee that every
            entity was synchronized or that a rebuild is complete; inspect `message` for reported
            failures.
          enum:
            - SUBMITTED
            - RUNNING
            - COMPLETED
            - FAILED
            - INTERRUPTED
        message:
          type: string
          description: Progress information or an error message for the task
        metalake:
          type: string
          description: The metalake processed by the task
        metadataObject:
          type: string
          description: The metadata object processed by the task
        cascade:
          type: boolean
          description: Whether descendant metadata objects are included in the task
        taskCreateTime:
          type: integer
          format: int64
          description: The task creation time in milliseconds since the Unix epoch
        taskUpdateTime:
          type: integer
          format: int64
          description: The last task update time in milliseconds since the Unix epoch
