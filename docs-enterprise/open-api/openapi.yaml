components:
  parameters:
    InternalOriginHeader:
      name: X-Gravitino-Internal-Origin
      in: header
      required: true
      description: >
        Required on internal APIs under `/internal`. Any non-empty value is accepted. Requests
        without it are rejected with HTTP 400, unless the server sets
        `gravitino.datastrato.internalApi.requireOriginHeader = false`.
      schema:
        type: string
        minLength: 1
      example: gravitino-web

  securitySchemes:

    OAuth2WithJWT:
      type: oauth2
      description: OAuth2 with JWT
      flows:
        clientCredentials:
          tokenUrl: https://external-oauth-server.com/token
          scopes:
            serviceAudience: The audience name when Gravitino uses OAuth as the authenticator.

    BasicAuth:
      type: http
      scheme: basic

    KerberosAuth:
      type: http
      scheme: negotiate
