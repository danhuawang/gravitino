---
openapi: 3.0.3
info:
  title: Datastrato REST API
  version: 1.3.0
  description: |
    Defines the specification for the Datastrato Gravitino REST API.

    Paths under `/internal` are **internal APIs** used by the Gravitino Enterprise Web UI and
    bundled tools. They are not part of the public REST API and may change without notice.
    Requests to them must include the `X-Gravitino-Internal-Origin` header; requests without
    it are rejected with HTTP 400. All other paths are public APIs.


servers:
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable.
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: http
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "8090"
      basePath:
        description: Optional prefix to be appended to all routes
        default: "api"

security:
  - OAuth2WithJWT: [serviceAudience]
  - BasicAuth: []

