---

paths:

  /web/metalakes/{metalake}/connections/{connection}/credential-providers/{credentialType}/test:
    parameters:
      - name: metalake
        in: path
        description: The metalake name
        required: true
        schema:
          type: string
      - name: connection
        in: path
        description: The Catalog name used as the connection name
        required: true
        schema:
          type: string
      - name: credentialType
        in: path
        description: The canonical credential provider type
        required: true
        schema:
          type: string
    post:
      tags:
        - credentials
      summary: Test an existing connection credential provider
      operationId: testExistingCredentialProvider
      description: |
        Tests a credential provider with the current persisted Catalog properties.
        Optional Catalog updates are applied in memory so proposed credential changes
        can be tested without altering the Catalog. Tests without proposed updates store
        the completed result against the current Catalog version; tests with proposed
        updates do not change the stored test status.
        Generated credential information is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialProviderTestRequest"
            example:
              path: s3://bucket/path
              updates:
                - "@type": setProperty
                  property: s3-access-key-id
                  value: proposed-access-key
      responses:
        "200":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: Forbidden - The caller does not own the requested Catalog
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "404":
          description: Not Found - The specified metalake or Catalog does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    CredentialProviderTestRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          minLength: 1
          description: The storage path used to generate a scoped credential
        updates:
          type: array
          description: |
            Optional Catalog updates to apply in memory for this test. Property updates and
            removals affect the effective credential configuration.
          items:
            $ref: "../../docs/open-api/catalogs.yaml#/components/schemas/CatalogUpdateRequest"
