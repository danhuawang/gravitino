---

paths:

  /web/credential-providers/{credentialType}/test:
    parameters:
      - name: credentialType
        in: path
        description: The credential provider type
        required: true
        schema:
          type: string
    post:
      tags:
        - credentials
      summary: Test a credential provider
      operationId: testCredentialProvider
      description: |
        Tests whether a credential provider can be initialized and generate a
        path-scoped credential. Generated credential information is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialProviderTestRequest"
            example:
              path: s3://bucket/path
              properties:
                key: value
      responses:
        "200":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    CredentialProviderTestRequest:
      type: object
      required:
        - path
        - properties
      properties:
        path:
          type: string
          minLength: 1
          description: The storage path used to generate a scoped credential
        properties:
          type: object
          description: Properties used to initialize the credential provider
          additionalProperties:
            type: string
