---

paths:
  /web/metalakes/{metalake}/tags:
    parameters:
      - $ref: "../../docs/open-api/openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - tag
      summary: List tags with enterprise details
      operationId: listExtendedTags
      description: |
        Lists tag names when `details` is false. When `details` is true, lists tag information
        together with each tag's owner. The owner is null when authorization is disabled or no
        owner is assigned.
      parameters:
        - $ref: "../../docs/open-api/tags.yaml#/components/parameters/details"
      responses:
        "200":
          description: Returns tag names or detailed tag objects with owners
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "../../docs/open-api/openapi.yaml#/components/schemas/NameListResponse"
                  - $ref: "#/components/schemas/ExtendedTagListResponse"
        "400":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../../docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    ExtendedTag:
      allOf:
        - $ref: "../../docs/open-api/tags.yaml#/components/schemas/Tag"
        - type: object
          required:
            - owner
          properties:
            owner:
              type: object
              allOf:
                - $ref: "../../docs/open-api/owners.yaml#/components/schemas/Owner"
              nullable: true

    ExtendedTagListResponse:
      type: object
      required:
        - code
        - tags
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        tags:
          type: array
          description: A list of tags and their owners
          items:
            $ref: "#/components/schemas/ExtendedTag"
