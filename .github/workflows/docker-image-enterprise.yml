name: Publish Enterprise Docker Image

on:
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: 'Choose the image to build'
        required: true
        default: 'enterprise-gravitino'
        options:
          - 'enterprise-gravitino'
          - 'enterprise-trino'
      version:
        description: 'The tag to apply to this image. The format is: {OSS-version}-{enterprise-version}.'
        required: true
        type: string

      username:
        description: 'Docker username'
        required: true
        type: string
      token:
        description: 'Publish Docker token'
        required: true
        type: string

      publish-latest-tag:
        description: 'Whether to update the latest tag. This operation is only applicable to official releases and should not be used for Release Candidate (RC).'
        required: false
        type: boolean
        default: false

      public-key-url:
        description: 'Raw URL of the ECDSA public key to embed in the server jar. Use the prod/ URL for customer releases and the test/ URL for staging builds.'
        required: true
        type: string

jobs:
  publish-docker-image:
    runs-on: gcp-arc-runners
    timeout-minutes: 120
    env:
      input_token: ${{ github.event.inputs.token }}
      secrets_token: ${{ secrets.PUBLISH_DOCKER_TOKEN }}
      LICENSE_PUBLIC_KEY_URL: ${{ github.event.inputs.public-key-url }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
    steps:
      - name: Verify and identify public key
        run: |
          KEY_URL="${{ github.event.inputs.public-key-url }}"
          http_code=$(curl -s -o /tmp/gravitino-master.pub -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "${KEY_URL}")
          if [[ "${http_code}" != "200" ]]; then
            echo "ERROR: public-key-url returned HTTP ${http_code}. Please verify the URL is correct and PRIVATE_REPO_ACCESS_TOKEN has read access."
            exit 1
          fi

          # Identify key environment from URL path
          if [[ "${KEY_URL}" == */prod/* ]]; then
            key_env="PRODUCTION"
          elif [[ "${KEY_URL}" == */test/* ]]; then
            key_env="TEST"
          else
            key_env="UNKNOWN (neither /prod/ nor /test/ found in URL)"
          fi

          fingerprint=$(sha256sum /tmp/gravitino-master.pub | awk '{print $1}')
          echo "============================================"
          echo "  Public key environment : ${key_env}"
          echo "  SHA-256 fingerprint    : ${fingerprint}"
          echo "  URL                    : ${KEY_URL}"
          echo "============================================"

          if [[ "${key_env}" == "UNKNOWN"* ]]; then
            echo "WARNING: Could not determine key environment from URL. Please confirm this is the correct key before proceeding."
          fi
      - name: Set environment variables
        run: |
          if [ "${{ github.event.inputs.image }}" == "enterprise-gravitino" ]; then
            echo "image_type=datastrato-gravitino" >> $GITHUB_ENV
            echo "image_name=datastratosandbox/enterprise" >> $GITHUB_ENV
            echo "tag_name=enterprise-gravitino" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.image }}" == "enterprise-trino" ]; then
            echo "image_type=trino" >> $GITHUB_ENV
            echo "image_name=datastratosandbox/enterprise" >> $GITHUB_ENV
            echo "tag_name=enterprise-trino" >> $GITHUB_ENV  
          fi

          if [ "${{ github.event.inputs.publish-latest-tag }}" == "true" ]; then
            echo "publish_latest=true" >> $GITHUB_ENV
          else
            echo "publish_latest=false" >> $GITHUB_ENV
          fi

      - name: Check publish Docker token
        run: |
          if [[ "${secrets_token}" != "${input_token}" ]]; then
            echo "You have entered an incorrect token. Please re-enter it."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ github.event.inputs.username }}
          password: ${{ secrets.DOCKER_REPOSITORY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties

      - name: Build and Push the Docker image
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          if [[ -n "${tag_name}" ]]; then
            full_tag_name="${tag_name}-${{ github.event.inputs.version }}"
          else
            full_tag_name="${{ github.event.inputs.version }}"
          fi

          if [[ "${publish_latest}" == "true" ]]; then
            echo "Publish tag ${full_tag_name}, and update latest too."
            ./dev/docker/build-docker.sh --platform all --type ${image_type} --image ${image_name} --tag ${full_tag_name} --latest
          else
            echo "Publish tag ${full_tag_name}."
            ./dev/docker/build-docker.sh --platform all --type ${image_type} --image ${image_name} --tag ${full_tag_name}
          fi
