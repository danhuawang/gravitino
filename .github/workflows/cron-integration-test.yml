name: Cron Integration Test

# Orchestrates Enterprise integration tests. It remains manual or callable so
# routine coverage stays in the dedicated run-ci-gated workflows.
#
# Phase-1 suites (gvfs-fuse, web-ui, frontend, contrib-catalog are excluded):
#   backend, spark, flink, maintenance, python, trino, access-control,
#   iceberg-rest-trino, mcp, idp, trino-multi-version, lance, multi-instance

run-name: Enterprise IT (${{ inputs.suites || 'all' }}) caller=${{ inputs.caller_run_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites, or all'
        required: false
        type: string
        default: 'all'
      java-version:
        description: 'JDK version'
        required: false
        type: string
        default: '17'
      caller_run_id:
        description: 'Optional caller GitHub run id'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      suites:
        required: false
        type: string
        default: 'all'
      java-version:
        required: false
        type: string
        default: '17'
      caller_run_id:
        required: false
        type: string
        default: ''

concurrency:
  group: cron-integration-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-suites:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parse.outputs.backend }}
      spark: ${{ steps.parse.outputs.spark }}
      flink: ${{ steps.parse.outputs.flink }}
      maintenance: ${{ steps.parse.outputs.maintenance }}
      python: ${{ steps.parse.outputs.python }}
      trino: ${{ steps.parse.outputs.trino }}
      access-control: ${{ steps.parse.outputs.access-control }}
      iceberg-rest-trino: ${{ steps.parse.outputs.iceberg-rest-trino }}
      mcp: ${{ steps.parse.outputs.mcp }}
      idp: ${{ steps.parse.outputs.idp }}
      trino-multi-version: ${{ steps.parse.outputs.trino-multi-version }}
      lance: ${{ steps.parse.outputs.lance }}
      multi-instance: ${{ steps.parse.outputs.multi-instance }}
      cloud-test: ${{ steps.parse.outputs.cloud-test }}
      java-version: ${{ steps.parse.outputs.java-version }}
    steps:
      - name: Parse suite selection
        id: parse
        env:
          SUITES: ${{ inputs.suites || 'all' }}
          JAVA_VERSION: ${{ inputs.java-version || '17' }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id || 'manual' }}
        run: |
          python3 << 'PY'
          import os

          known = [
              "backend",
              "spark",
              "flink",
              "maintenance",
              "python",
              "trino",
              "access-control",
              "iceberg-rest-trino",
              "mcp",
              "idp",
              "trino-multi-version",
              "lance",
              "multi-instance",
              "cloud-test",
          ]
          raw = os.environ["SUITES"].strip().lower()
          if raw in ("all", ""):
              selected = set(known)
          else:
              selected = {item.strip() for item in raw.split(",") if item.strip()}
              unknown = selected - set(known)
              if unknown:
                  raise SystemExit(f"Unknown suites: {sorted(unknown)}. Known: {known}")

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              for name in known:
                  value = "true" if name in selected else "false"
                  handle.write(f"{name}={value}\n")
                  print(f"{name}={value}")
              handle.write(f"java-version={os.environ['JAVA_VERSION']}\n")
          print(f"caller_run_id={os.environ['CALLER_RUN_ID']}")
          PY

  backend:
    name: backend
    needs: select-suites
    if: needs.select-suites.outputs.backend == 'true'
    uses: ./.github/workflows/backend-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
      backend: mysql
      test-mode: deploy
    secrets: inherit

  spark:
    name: spark
    needs: select-suites
    if: needs.select-suites.outputs.spark == 'true'
    secrets: inherit
    uses: ./.github/workflows/spark-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
      scala-version: '2.12'
      test-mode: deploy

  flink:
    name: flink
    needs: select-suites
    if: needs.select-suites.outputs.flink == 'true'
    secrets: inherit
    uses: ./.github/workflows/flink-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  maintenance:
    name: maintenance
    needs: select-suites
    if: needs.select-suites.outputs.maintenance == 'true'
    secrets: inherit
    uses: ./.github/workflows/maintenance-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  python:
    name: python
    needs: select-suites
    if: needs.select-suites.outputs.python == 'true'
    secrets: inherit
    uses: ./.github/workflows/python-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  trino:
    name: trino
    needs: select-suites
    if: needs.select-suites.outputs.trino == 'true'
    secrets: inherit
    uses: ./.github/workflows/trino-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  access-control:
    name: access-control
    needs: select-suites
    if: needs.select-suites.outputs.access-control == 'true'
    secrets: inherit
    uses: ./.github/workflows/access-control-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  iceberg-rest-trino:
    name: iceberg-rest-trino
    needs: select-suites
    if: needs.select-suites.outputs.iceberg-rest-trino == 'true'
    secrets: inherit
    uses: ./.github/workflows/iceberg-rest-trino-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}

  mcp:
    name: mcp
    needs: select-suites
    if: needs.select-suites.outputs.mcp == 'true'
    secrets: inherit
    uses: ./.github/workflows/mcp-integration-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}

  idp:
    name: idp
    needs: select-suites
    if: needs.select-suites.outputs.idp == 'true'
    secrets: inherit
    uses: ./.github/workflows/idp-basic-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}

  trino-multi-version:
    name: trino-multi-version
    needs: select-suites
    if: needs.select-suites.outputs.trino-multi-version == 'true'
    uses: ./.github/workflows/trino-multi-version-test-action.yml
    secrets: inherit

  lance:
    name: lance
    needs: select-suites
    if: needs.select-suites.outputs.lance == 'true'
    uses: ./.github/workflows/lance-compatibility-matrix-test-action.yml
    secrets: inherit

  multi-instance:
    name: multi-instance
    needs: select-suites
    if: needs.select-suites.outputs.multi-instance == 'true'
    strategy:
      fail-fast: false
      matrix:
        backend: [ postgresql, mysql ]
    uses: ./.github/workflows/multi-instance-consistency-test-action.yml
    with:
      backend: ${{ matrix.backend }}
    secrets: inherit

  cloud-test:
    name: cloud-test
    needs: select-suites
    if: needs.select-suites.outputs.cloud-test == 'true'
    runs-on: gcp-arc-runners
    env:
      GRAVITINO_TEST_CLOUD_IT: true
      S3_STS_ACCESS_KEY_ID: ${{ secrets.S3_STS_ACCESS_KEY_ID }}
      S3_STS_SECRET_ACCESS_KEY: ${{ secrets.S3_STS_SECRET_ACCESS_KEY }}
      S3_STS_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_STS_BUCKET_NAME: ${{ vars.S3_BUCKET }}
      S3_STS_REGION: ${{ vars.S3_REGION }}
      S3_STS_ROLE_ARN: ${{ vars.S3_ROLE_ARN }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_STS_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_STS_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET }}
      PLATFORM: linux/amd64
      S3_ACCESS_KEY_ID_FOR_CREDENTIAL: ${{ secrets.S3_STS_ACCESS_KEY_ID }}
      S3_BUCKET_NAME_FOR_CREDENTIAL: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT_FOR_CREDENTIAL: ${{ vars.S3_ENDPOINT }}
      S3_REGION_FOR_CREDENTIAL: ${{ vars.S3_REGION }}
      S3_ROLE_ARN_FOR_CREDENTIAL: ${{ vars.S3_ROLE_ARN }}
      S3_ROLE_ARN: ${{ vars.S3_ROLE_ARN }}
      S3_SECRET_ACCESS_KEY_FOR_CREDENTIAL: ${{ secrets.S3_STS_SECRET_ACCESS_KEY }}
      GCS_BUCKET_NAME_FOR_CREDENTIAL: ${{ vars.GCS_BUCKET }}
      GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET }}
      GRAVITINO_HOME: ${{ github.workspace }}/distribution/package
      PYTHON_BUILD_PATH: ${{ github.workspace }}/clients/client-python/build
      GRAVITINO_CI_HIVE_DOCKER_IMAGE: apache/gravitino-ci:hive-0.1.20
      DOCKER_TEST: "true"
      GRAVITINO_GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      GRAVITINO_S3_ACCESS_KEY: ${{ secrets.S3_STS_ACCESS_KEY_ID }}
      GRAVITINO_S3_BUCKET: ${{ vars.S3_BUCKET }}
      GRAVITINO_S3_REGION: ${{ vars.S3_REGION }}
      GRAVITINO_S3_ROLE_ARN: ${{ vars.S3_ROLE_ARN }}
      GRAVITINO_S3_SECRET_KEY: ${{ secrets.S3_STS_SECRET_ACCESS_KEY }}
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ needs.select-suites.outputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Create GCS credentials
        env:
          GCS_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON_CONTENT }}
        run: |
          credential_path="${RUNNER_TEMP}/gcs-service-account.json"
          umask 077
          printf '%s' "$GCS_SERVICE_ACCOUNT_JSON_CONTENT" > "$credential_path"
          chmod 600 "$credential_path"
          test -s "$credential_path"
          python3 -m json.tool "$credential_path" > /dev/null
          {
            echo "GCS_SERVICE_ACCOUNT_JSON_PATH_FOR_CREDENTIAL=$credential_path"
            echo "GCS_SERVICE_ACCOUNT_JSON_PATH=$credential_path"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_path"
          } >> "$GITHUB_ENV"

      - name: Check required command
        run: dev/ci/check_commands.sh

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package
        run: |
          export MINIFORGE_BIN="$GITHUB_WORKSPACE/.gradle/python/Linux/Miniforge3/bin"
          export PATH="$MINIFORGE_BIN:$PATH"

          ./gradlew build -x checkAddedEnterpriseFilesHaveEnterpriseOnlyHeader -x test
          mkdir -p /tmp/bundles
          cp -r bundles/*-bundle/build/libs/*.jar /tmp/bundles

          mkdir -p /tmp/irc-bundles
          cp -r bundles/iceberg-*/build/libs/*.jar /tmp/irc-bundles
          ./gradlew compileDistribution -x test -PjdkVersion=${{ needs.select-suites.outputs.java-version }}

          # distribution already at repo root after flat build
          cp -r /tmp/bundles/* ./distribution/package/catalogs/fileset/libs
          cp -r /tmp/irc-bundles/* ./distribution/package/iceberg-rest-server/libs

      - name: IRC IcebergRESTS3TokenIT Test
        run: |
          ./gradlew -PskipTests -PtestMode=deploy -PskipDockerTests=false :iceberg:iceberg-rest-server:test --tests "org.apache.gravitino.iceberg.integration.test.IcebergRESTS3TokenIT"

      - name: IRC IcebergRESTGCSIT Test
        run: |
          ./gradlew -PskipTests -PtestMode=deploy -PskipDockerTests=false :iceberg:iceberg-rest-server:test --tests "org.apache.gravitino.iceberg.integration.test.IcebergRESTGCSIT"

      - name: Fileset Cloud Integration Test python
        id: integrationTest1
        run: |
          echo "==============start gravitino server================="
          cd distribution/package/bin
          pwd
          ./gravitino.sh start
          cd -
          pwd
          cd clients/client-python
          python3 -m venv venv
          source venv/bin/activate
          pip install .
          pip install -r requirements-dev.txt
          echo "============ Start to run test_gvfs_with_s3 and test_gvfs_with_s3_credential ============"
          python -m unittest tests.integration.test_gvfs_with_s3_credential -v
          echo "============ Start to run test_gvfs_with_gcs and test_gvfs_with_gcs_credential ============"
          python -m unittest tests.integration.test_gvfs_with_gcs_credential -v
          echo "==============stop gravitino server================="
          cd -
          cd distribution/package/bin
          ./gravitino.sh stop

      - name: Update S3_BUCKET_NAME env var
        run: |
          echo "S3_BUCKET_NAME=amzn-s3-ci-sydney-bucket" >> "$GITHUB_ENV"

      - name: Fileset Cloud Integration Test java
        run: |
          ./gradlew -PskipTests -PtestMode=deploy -PjdkVersion=${{ needs.select-suites.outputs.java-version }} -PjdbcBackend=postgresql -PskipDockerTests=false :clients:filesystem-hadoop3:test --tests "org.apache.gravitino.filesystem.hadoop.integration.test.**"

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: integrate test reports-cloud-test-${{ needs.select-suites.outputs.java-version }}
          path: |
            build/reports
            iceberg/iceberg-rest-server/build/*.log
            integration-test/build/*.log
            integration-test/build/*.tar
            integration-test/build/trino-ci-container-log/hive/*.*
            integration-test/build/trino-ci-container-log/hdfs/*.*
            catalogs/**/*.log
            catalogs/**/*.tar
            distribution/**/*.log
            distribution/**/*.out

      - name: Remove GCS credentials
        if: ${{ always() }}
        run: rm -f -- "${RUNNER_TEMP}/gcs-service-account.json"

  summary:
    name: Integration test summary
    needs:
      - select-suites
      - backend
      - spark
      - flink
      - maintenance
      - python
      - trino
      - access-control
      - iceberg-rest-trino
      - mcp
      - idp
      - trino-multi-version
      - lance
      - multi-instance
      - cloud-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          BACKEND: ${{ needs.backend.result }}
          SPARK: ${{ needs.spark.result }}
          FLINK: ${{ needs.flink.result }}
          MAINTENANCE: ${{ needs.maintenance.result }}
          PYTHON: ${{ needs.python.result }}
          TRINO: ${{ needs.trino.result }}
          ACCESS_CONTROL: ${{ needs.access-control.result }}
          ICEBERG_REST_TRINO: ${{ needs.iceberg-rest-trino.result }}
          MCP: ${{ needs.mcp.result }}
          IDP: ${{ needs.idp.result }}
          TRINO_MULTI_VERSION: ${{ needs.trino-multi-version.result }}
          LANCE: ${{ needs.lance.result }}
          MULTI_INSTANCE: ${{ needs.multi-instance.result }}
          CLOUD_TEST: ${{ needs.cloud-test.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Enterprise Integration Test Summary

          | | |
          |---|---|
          | **Ref** | \`${{ github.ref_name }} (${{ github.sha }})\` |
          | **Suites** | \`${{ inputs.suites || 'all' }}\` |
          | **Java** | \`${{ needs.select-suites.outputs.java-version }}\` |
          | **Caller run** | \`${{ inputs.caller_run_id || 'manual' }}\` |

          | Suite | Result |
          |-------|--------|
          | backend | ${BACKEND} |
          | spark | ${SPARK} |
          | flink | ${FLINK} |
          | maintenance | ${MAINTENANCE} |
          | python | ${PYTHON} |
          | trino | ${TRINO} |
          | access-control | ${ACCESS_CONTROL} |
          | iceberg-rest-trino | ${ICEBERG_REST_TRINO} |
          | mcp | ${MCP} |
          | idp | ${IDP} |
          | trino-multi-version | ${TRINO_MULTI_VERSION} |
          | lance | ${LANCE} |
          | multi-instance | ${MULTI_INSTANCE} |
          | cloud-test | ${CLOUD_TEST} |
          EOF

          failed=0
          if [[ "${{ needs.select-suites.result }}" != "success" ]]; then
            failed=1
          fi
          for result in "$BACKEND" "$SPARK" "$FLINK" "$MAINTENANCE" "$PYTHON" "$TRINO" \
            "$ACCESS_CONTROL" "$ICEBERG_REST_TRINO" "$MCP" "$IDP" \
            "$TRINO_MULTI_VERSION" "$LANCE" "$MULTI_INSTANCE" "$CLOUD_TEST"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed=1
            fi
          done
          exit "$failed"
