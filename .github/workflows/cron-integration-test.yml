name: Cron Integration Test

# Orchestrates enterprise integration tests. No schedule: gravitino-test
# release-test.yaml dispatches this workflow on the chosen gravitino-enterprise ref
# (main or branch-1.3). Manual runs use workflow_dispatch.
#
# Phase-1 suites (cloud-test, service-e2e, gvfs-fuse, web-ui, frontend are excluded):
#   backend, spark, flink, maintenance, python, trino, trino-enterprise,
#   access-control, iceberg-rest-trino, search, mcp, scim-service, scim-extension, idp,
#   trino-multi-version, lance, multi-instance
#   Alias: scim -> scim-service,scim-extension

run-name: Enterprise IT (${{ inputs.suites || 'all' }}) caller=${{ inputs.caller_run_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites, or all'
        required: false
        type: string
        default: 'all'
      java-version:
        description: 'JDK version'
        required: false
        type: string
        default: '17'
      caller_run_id:
        description: 'Optional caller GitHub run id (used by release-test to locate this run)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      suites:
        required: false
        type: string
        default: 'all'
      java-version:
        required: false
        type: string
        default: '17'
      caller_run_id:
        required: false
        type: string
        default: ''

concurrency:
  group: cron-integration-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-suites:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parse.outputs.backend }}
      spark: ${{ steps.parse.outputs.spark }}
      flink: ${{ steps.parse.outputs.flink }}
      maintenance: ${{ steps.parse.outputs.maintenance }}
      python: ${{ steps.parse.outputs.python }}
      trino: ${{ steps.parse.outputs.trino }}
      trino-enterprise: ${{ steps.parse.outputs.trino-enterprise }}
      access-control: ${{ steps.parse.outputs.access-control }}
      iceberg-rest-trino: ${{ steps.parse.outputs.iceberg-rest-trino }}
      search: ${{ steps.parse.outputs.search }}
      mcp: ${{ steps.parse.outputs.mcp }}
      scim-service: ${{ steps.parse.outputs.scim-service }}
      scim-extension: ${{ steps.parse.outputs.scim-extension }}
      idp: ${{ steps.parse.outputs.idp }}
      trino-multi-version: ${{ steps.parse.outputs.trino-multi-version }}
      lance: ${{ steps.parse.outputs.lance }}
      multi-instance: ${{ steps.parse.outputs.multi-instance }}
      java-version: ${{ steps.parse.outputs.java-version }}
    steps:
      - name: Parse suite selection
        id: parse
        env:
          SUITES: ${{ inputs.suites || 'all' }}
          JAVA_VERSION: ${{ inputs.java-version || '17' }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id || 'manual' }}
        run: |
          python3 << 'PY'
          import os

          known = [
              "backend",
              "spark",
              "flink",
              "maintenance",
              "python",
              "trino",
              "trino-enterprise",
              "access-control",
              "iceberg-rest-trino",
              "search",
              "mcp",
              "scim-service",
              "scim-extension",
              "idp",
              "trino-multi-version",
              "lance",
              "multi-instance",
          ]
          aliases = {"scim": ["scim-service", "scim-extension"]}
          raw = os.environ["SUITES"].strip().lower()
          if raw in ("all", ""):
              selected = set(known)
          else:
              selected = {item.strip() for item in raw.split(",") if item.strip()}
              expanded = set()
              for item in selected:
                  if item in aliases:
                      expanded.update(aliases[item])
                  else:
                      expanded.add(item)
              selected = expanded
              unknown = selected - set(known)
              if unknown:
                  raise SystemExit(
                      f"Unknown suites: {sorted(unknown)}. Known: {known} aliases: {list(aliases)}"
                  )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              for name in known:
                  value = "true" if name in selected else "false"
                  handle.write(f"{name}={value}\n")
                  print(f"{name}={value}")
              handle.write(f"java-version={os.environ['JAVA_VERSION']}\n")
          print(f"caller_run_id={os.environ['CALLER_RUN_ID']}")
          PY

  backend:
    name: backend
    needs: select-suites
    if: needs.select-suites.outputs.backend == 'true'
    uses: ./.github/workflows/backend-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
      backend: mysql
      test-mode: deploy
      changed-catalogs-contrib-modules: __all__
    secrets: inherit

  spark:
    name: spark
    needs: select-suites
    if: needs.select-suites.outputs.spark == 'true'
    uses: ./.github/workflows/spark-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
      scala-version: '2.12'
      test-mode: deploy
    secrets: inherit

  flink:
    name: flink
    needs: select-suites
    if: needs.select-suites.outputs.flink == 'true'
    uses: ./.github/workflows/flink-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  maintenance:
    name: maintenance
    needs: select-suites
    if: needs.select-suites.outputs.maintenance == 'true'
    uses: ./.github/workflows/maintenance-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  python:
    name: python
    needs: select-suites
    if: needs.select-suites.outputs.python == 'true'
    uses: ./.github/workflows/python-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  trino:
    name: trino
    needs: select-suites
    if: needs.select-suites.outputs.trino == 'true'
    uses: ./.github/workflows/trino-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  trino-enterprise:
    name: trino-enterprise
    needs: select-suites
    if: needs.select-suites.outputs.trino-enterprise == 'true'
    uses: ./.github/workflows/trino-enterprise-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  access-control:
    name: access-control
    needs: select-suites
    if: needs.select-suites.outputs.access-control == 'true'
    uses: ./.github/workflows/access-control-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  iceberg-rest-trino:
    name: iceberg-rest-trino
    needs: select-suites
    if: needs.select-suites.outputs.iceberg-rest-trino == 'true'
    uses: ./.github/workflows/iceberg-rest-trino-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  search:
    name: search
    needs: select-suites
    if: needs.select-suites.outputs.search == 'true'
    uses: ./.github/workflows/search-integration-test-action.yml
    with:
      architecture: linux/amd64
      java-version: ${{ needs.select-suites.outputs.java-version }}
      test-mode: deploy
    secrets: inherit

  mcp:
    name: mcp
    needs: select-suites
    if: needs.select-suites.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp-integration-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  scim-service:
    name: scim-service
    needs: select-suites
    if: needs.select-suites.outputs.scim-service == 'true'
    uses: ./.github/workflows/scim-service-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  scim-extension:
    name: scim-extension
    needs: select-suites
    if: needs.select-suites.outputs.scim-extension == 'true'
    uses: ./.github/workflows/scim-extension-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  idp:
    name: idp
    needs: select-suites
    if: needs.select-suites.outputs.idp == 'true'
    uses: ./.github/workflows/idp-basic-test-action.yml
    with:
      java-version: ${{ needs.select-suites.outputs.java-version }}
    secrets: inherit

  trino-multi-version:
    name: trino-multi-version
    needs: select-suites
    if: needs.select-suites.outputs.trino-multi-version == 'true'
    uses: ./.github/workflows/trino-multi-version-test-action.yml
    secrets: inherit

  lance:
    name: lance
    needs: select-suites
    if: needs.select-suites.outputs.lance == 'true'
    uses: ./.github/workflows/lance-compatibility-matrix-test-action.yml
    secrets: inherit

  multi-instance:
    name: multi-instance
    needs: select-suites
    if: needs.select-suites.outputs.multi-instance == 'true'
    uses: ./.github/workflows/multi-instance-consistency-test-action.yml
    secrets: inherit

  summary:
    name: Integration test summary
    needs:
      - select-suites
      - backend
      - spark
      - flink
      - maintenance
      - python
      - trino
      - trino-enterprise
      - access-control
      - iceberg-rest-trino
      - search
      - mcp
      - scim-service
      - scim-extension
      - idp
      - trino-multi-version
      - lance
      - multi-instance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          BACKEND: ${{ needs.backend.result }}
          SPARK: ${{ needs.spark.result }}
          FLINK: ${{ needs.flink.result }}
          MAINTENANCE: ${{ needs.maintenance.result }}
          PYTHON: ${{ needs.python.result }}
          TRINO: ${{ needs.trino.result }}
          TRINO_ENTERPRISE: ${{ needs.trino-enterprise.result }}
          ACCESS_CONTROL: ${{ needs.access-control.result }}
          ICEBERG_REST_TRINO: ${{ needs.iceberg-rest-trino.result }}
          SEARCH: ${{ needs.search.result }}
          MCP: ${{ needs.mcp.result }}
          SCIM_SERVICE: ${{ needs.scim-service.result }}
          SCIM_EXTENSION: ${{ needs.scim-extension.result }}
          IDP: ${{ needs.idp.result }}
          TRINO_MULTI_VERSION: ${{ needs.trino-multi-version.result }}
          LANCE: ${{ needs.lance.result }}
          MULTI_INSTANCE: ${{ needs.multi-instance.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Enterprise Integration Test Summary

          | | |
          |---|---|
          | **Ref** | \`${{ github.ref_name }} (${{ github.sha }})\` |
          | **Suites** | \`${{ inputs.suites || 'all' }}\` |
          | **Java** | \`${{ needs.select-suites.outputs.java-version }}\` |
          | **Caller run** | \`${{ inputs.caller_run_id || 'manual' }}\` |

          | Suite | Result |
          |-------|--------|
          | backend | ${BACKEND} |
          | spark | ${SPARK} |
          | flink | ${FLINK} |
          | maintenance | ${MAINTENANCE} |
          | python | ${PYTHON} |
          | trino | ${TRINO} |
          | trino-enterprise | ${TRINO_ENTERPRISE} |
          | access-control | ${ACCESS_CONTROL} |
          | iceberg-rest-trino | ${ICEBERG_REST_TRINO} |
          | search | ${SEARCH} |
          | mcp | ${MCP} |
          | scim-service | ${SCIM_SERVICE} |
          | scim-extension | ${SCIM_EXTENSION} |
          | idp | ${IDP} |
          | trino-multi-version | ${TRINO_MULTI_VERSION} |
          | lance | ${LANCE} |
          | multi-instance | ${MULTI_INSTANCE} |
          EOF

          failed=0
          if [[ "${{ needs.select-suites.result }}" != "success" ]]; then
            failed=1
          fi
          for result in "$BACKEND" "$SPARK" "$FLINK" "$MAINTENANCE" "$PYTHON" "$TRINO" \
            "$TRINO_ENTERPRISE" "$ACCESS_CONTROL" "$ICEBERG_REST_TRINO" "$SEARCH" "$MCP" \
            "$SCIM_SERVICE" "$SCIM_EXTENSION" "$IDP" \
            "$TRINO_MULTI_VERSION" "$LANCE" "$MULTI_INSTANCE"
          do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed=1
            fi
          done
          exit "$failed"
