name: Multi-Instance Consistency Test

# Verifies that entity and authorization caches propagate changes correctly
# between two Gravitino instances backed by the same entity store. The backend
# matrix covers PostgreSQL (what the enterprise chart ships) and MySQL. The
# entity test warms one instance, mutates the other, and then re-reads the
# target until it converges or the convergence deadline expires.
#
# The test plans and assertions live in dev/ci/test_multi_instance_entity_cache_consistency.sh
# and dev/ci/test_multi_instance_consistency.sh.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            authz_changes:
              - .github/workflows/multi-instance-consistency-test.yml
              - .github/workflows/multi-instance-consistency-test-action.yml
              - api/**
              - common/**
              - core/**
              - server/**
              - server-common/**
              - conf/**
              - scripts/mysql/**
              - scripts/postgresql/**
              - scripts/enterprise/**
              - dev/ci/test_multi_instance_consistency.sh
              - dev/ci/test_multi_instance_entity_cache_consistency.sh
              - dev/ci/setup_multi_instance.sh
              - build.gradle.kts
              - gradle.properties
              - gradle/**
              - settings.gradle.kts
    outputs:
      authz_changes: ${{ steps.filter.outputs.authz_changes }}

  multi-instance-consistency:
    needs: changes
    if: needs.changes.outputs.authz_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        backend: [ postgresql, mysql ]
    uses: ./.github/workflows/multi-instance-consistency-test-action.yml
    with:
      backend: ${{ matrix.backend }}
    secrets:
      ENTERPRISE_TEST_PUBLIC_KEY_URI: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      PRIVATE_REPO_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      ENTERPRISE_TEST_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
