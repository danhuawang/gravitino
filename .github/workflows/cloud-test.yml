name: Cloud Test

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    types: [labeled]
    branches: [ "main", "branch-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            cloud_changes:
              - .github/workflows/cloud-test.yml
              - api/**
              - authorization-jdbc-enterprise/**
              - authorizations/**
              - bin/**
              - bundles/**
              - catalogs/catalog-common/**
              - catalogs/catalog-fileset/**
              - catalogs/hadoop-auth/**
              - catalogs/hadoop-common/**
              - clients/client-java/**
              - clients/client-java-runtime/**
              - clients/client-python/**
              - clients/filesystem-hadoop3/**
              - common/**
              - common-extension/**
              - conf/**
              - core/**
              - core-extension/**
              - datastrato-server/**
              - dev/**
              - distribution/**
              - enterprise-licensing/**
              - gradle/**
              - iceberg/**
              - integration-test-common/**
              - licensing/**
              - scripts/**
              - server/**
              - server-common/**
              - test/**
              - build.gradle.kts
              - enterprise-licensing.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
      - name: Force Cloud Test for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "cloud_changes=true" >> "$GITHUB_OUTPUT"
    outputs:
      cloud_changes: ${{ steps.manual.outputs.cloud_changes || steps.filter.outputs.cloud_changes }}

  # Integration test for AMD64 architecture
  test-amd64-arch:
    needs: changes
    if: needs.changes.outputs.cloud_changes == 'true'
    strategy:
      matrix:
        java-version: [ 17 ]
    uses: ./.github/workflows/cloud-integration-test-action.yml
    with:
      java-version: ${{ matrix.java-version }}
    secrets:
      S3_STS_ACCESS_KEY_ID: ${{ secrets.S3_STS_ACCESS_KEY_ID }}
      S3_STS_SECRET_ACCESS_KEY: ${{ secrets.S3_STS_SECRET_ACCESS_KEY }}
      GCS_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON_CONTENT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PRIVATE_REPO_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      ENTERPRISE_TEST_PUBLIC_KEY_URI: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      ENTERPRISE_TEST_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
