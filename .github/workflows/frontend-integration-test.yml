name: Frontend Integration Test

# Controls when the workflow will run
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - .github/**
              - api/**
              - bin/**
              - authorizations/**
              - bundles/**
              - catalogs/**
              - catalogs-contrib/**
              - clients/**
              - common/**
              - conf/**
              - core/**
              - dev/**
              - gradle/**
              - iceberg/**
              - lance/**
              - scripts/**
              - server/**
              - meta/**
              - server-common/**
              - integration-test-common/**
              - web-v2/**
              - '**/*.kts'
              - '**/*.py'
              - '**/*.properties'
              - '**/*.sh'
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}

  FrontendIT:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    runs-on: gcp-arc-runners
    timeout-minutes: 90
    strategy:
      matrix:
        # Integration test for AMD64 architecture
        architecture: [linux/amd64]
        java-version: [ 17 ]
    env:
      PLATFORM: ${{ matrix.architecture }}
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Package Gravitino
        run: |
          GRAVITINO_USE_WEB_V2=true ./gradlew compileDistribution compileTrinoConnector -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libgconf-2-4 libappindicator1 libxss1 libxkbcommon0 libnss3 libgconf-2-4 libappindicator1 libxss1 libasound2 fonts-liberation libatk-bridge2.0-0 libgtk-3-0 libgbm1

      - name: Frontend Integration Test
        id: integrationTest
        run: |
          GRAVITINO_USE_WEB_V2=true ./gradlew -PskipTests -PtestMode=embedded -PskipDockerTests=false :web-v2:integration-test:test
          GRAVITINO_USE_WEB_V2=true ./gradlew -PskipTests -PtestMode=deploy -PskipDockerTests=false :web-v2:integration-test:test

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: integrate-test-reports-${{ matrix.java-version }}
          path: |
            build/reports
            integration-test-common/build/*.log
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
            catalogs/**/*.log
            catalogs/**/*.tar
            web-v2/integration-test/build/*.log