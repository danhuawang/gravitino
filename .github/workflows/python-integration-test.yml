name: Python Client Integration Test

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    types: [labeled]
    branches: [ "main", "branch-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Integration test for AMD64 architecture
  test-amd64-arch:
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: [self-hosted, linux, x64, ubuntu-latest, xlarge]
    timeout-minutes: 45
    strategy:
      matrix:
        architecture: [linux/amd64]
        java-version: [ 17 ]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Python Client Integration Test
        id: integrationTest
        run: |
          ./gradlew compileDistribution -x test -PjdkVersion=${{ matrix.java-version }}
          
          sed -i '/= *opensearch/d' ./distribution/package/conf/gravitino.conf
          sed -i '/= *search/d' ./distribution/package/conf/gravitino.conf

          echo "gravitino.datastrato.search.storage.impl = memory" >> ./distribution/package/conf/gravitino.conf 
          cp -r -f ./distribution ./gravitino-oss
          
          ./gradlew -p gravitino-oss -PjdkVersion=${{ matrix.java-version }} -PpythonVersion=3.9 -PskipDockerTests=false :clients:client-python:test

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.integrationTest.outcome == 'failure' }}
        with:
          name: integrate test reports
          path: |
            gravitino-oss/build/reports
            gravitino-oss/integration-test/build/integration-test.log
            gravitino-oss/distribution/package/logs/gravitino-server.out
            gravitino-oss/distribution/package/logs/gravitino-server.log
            gravitino-oss/catalogs/**/*.log
            gravitino-oss/catalogs/**/*.tar
