# Periodically syncs apache/gravitino main into this repository's main branch.
# - Clean merge  → opens a PR that can be merged directly.
# - Merge conflicts → commits files with conflict markers and opens a PR
#   labelled "upstream-conflict" so a human can resolve and merge.

name: Sync Apache Gravitino Upstream

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout enterprise main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # A PAT is used instead of GITHUB_TOKEN to allow PR creation when
          # organization or ruleset restrictions block the Actions bot.
          token: ${{ secrets.GRAVITINO_ENTERPRISE_SYNC }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add apache/gravitino as upstream remote
        run: |
          git remote add upstream https://github.com/apache/gravitino.git
          git fetch upstream main --no-tags

      - name: Determine sync branch name
        run: |
          echo "BRANCH=sync/upstream-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%d)"               >> "$GITHUB_ENV"

      - name: Create and push sync branch
        run: |
          git checkout -B "$BRANCH"

      # ── Attempt the merge ─────────────────────────────────────────────────

      - name: Merge upstream/main (no-commit so we can inspect the result)
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Check for real content conflicts BEFORE staging, because
            # git add --all clears the unmerged index entries and makes
            # git ls-files --unmerged always return nothing afterwards.
            if git ls-files --unmerged | grep -q .; then
              # Real content conflicts remain — stage with markers for human review.
              git add --all
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              git commit --no-verify \
                -m "chore: sync apache/gravitino upstream $DATE (conflicts present)"
            else
              # All conflicts were file-location only (e.g. directory renames);
              # stage and commit as a clean merge.
              git add --all
              echo "status=clean" >> "$GITHUB_OUTPUT"
              git commit --no-verify \
                -m "chore: sync apache/gravitino upstream $DATE"
            fi
          fi

      - name: Push sync branch
        run: |
          # Fetch the remote branch state so --force-with-lease can detect
          # in-progress conflict resolution by a human before overwriting.
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"
          # Wait for GitHub to propagate the branch before opening a PR
          sleep 5

      # ── Open PR – clean merge ─────────────────────────────────────────────

      - name: Open PR for clean merge
        if: steps.merge.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GRAVITINO_ENTERPRISE_SYNC }}
        run: |
          gh api repos/${{ github.repository }}/pulls \
            --method POST \
            --field base="main" \
            --field head="$BRANCH" \
            --field title="chore: sync apache/gravitino upstream ($DATE)" \
            --field body="$(cat <<EOF
          ## Upstream sync – $DATE

          This PR was opened automatically by the **Sync Apache Gravitino Upstream**
          workflow. It merges the latest \`apache/gravitino\` \`main\` branch into this
          repository with **no conflicts**.

          ### Checklist before merging
          - [ ] CI passes
          - [ ] No unintended changes to enterprise-specific files
          EOF
          )"

      # ── Open PR – conflicts present ───────────────────────────────────────

      - name: Open PR for conflicted merge
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GRAVITINO_ENTERPRISE_SYNC }}
        run: |
          # Collect the list of conflicted files from the merge commit.
          CONFLICTED=$(git diff --name-only HEAD~1 HEAD | head -100 || true)

          PR_NUMBER=$(gh api repos/${{ github.repository }}/pulls \
            --method POST \
            --field base="main" \
            --field head="$BRANCH" \
            --field title="chore: sync apache/gravitino upstream ($DATE) – CONFLICTS" \
            --field body="$(cat <<EOF
          ## Upstream sync – $DATE ⚠️ Conflicts need resolution

          This PR was opened automatically by the **Sync Apache Gravitino Upstream**
          workflow. The merge of \`apache/gravitino\` \`main\` encountered conflicts that
          **must be resolved by a human** before this branch can be merged.

          ### Files with conflict markers
          \`\`\`
          $CONFLICTED
          \`\`\`

          ### How to resolve
          1. Check out this branch locally:
             \`\`\`bash
             git fetch origin
             git checkout $BRANCH
             \`\`\`
          2. Open each file listed above, resolve the conflict markers, then stage and commit.
          3. Push the resolved branch – CI will run and the PR can be reviewed and merged.
          EOF
          )" \
            --jq '.number')
          # Add the upstream-conflict label using the PR number from the response
          gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels \
            --method POST --field labels[]="upstream-conflict" || true

      # ── Summary ───────────────────────────────────────────────────────────

      - name: Print summary
        if: always()
        run: |
          echo "### Upstream sync result" >> "$GITHUB_STEP_SUMMARY"
          echo ""                          >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merge.outputs.status }}" = "clean" ]; then
            echo "✅ Clean merge – PR opened, ready to review and merge." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Merge conflicts detected – PR opened, human resolution required." >> "$GITHUB_STEP_SUMMARY"
          fi
