name: Access Control Integration Test Action

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        description: 'Architecture of the platform'
        type: string
      java-version:
        required: true
        description: 'Java version'
        type: string

jobs:
  access-control-IT:
    name: JDK${{ inputs.java-version }}
    runs-on: gcp-arc-runners
    timeout-minutes: 90
    env:
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
      PLATFORM: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Package Gravitino
        run: |
          ./gradlew compileDistribution -PskipWeb=true -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Authorization Integration Test (JDK${{ inputs.java-version }})
        id: integrationTest
        run: |
          ./gradlew -PtestMode=embedded -PjdbcBackend=h2 -PskipDockerTests=false -PskipWeb=true :authorizations:test
          ./gradlew -PtestMode=deploy -PjdbcBackend=mysql -PskipDockerTests=false -PskipWeb=true :authorizations:test
          ./gradlew -PtestMode=deploy -PjdbcBackend=postgresql -PskipDockerTests=false -PskipWeb=true :authorizations:test

      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-xml-access-control-${{ inputs.java-version }}
          path: |
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: authorizations-integrate-test-reports-${{ inputs.java-version }}
          path: |
            build/reports
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
