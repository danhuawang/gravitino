name: Maintenance Integration Test Action

# run maintenance integration test
on:
  workflow_call:
    inputs:
      architecture:
        required: true
        description: 'Architecture of the platform'
        type: string
      java-version:
        required: true
        description: 'Java version'
        type: string

jobs:
  start-runner:
    name: JDK${{ inputs.java-version }}
    runs-on: gcp-arc-runners
    timeout-minutes: 60
    env:
      PLATFORM: ${{ inputs.architecture }}
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package Gravitino
        run: |
          ./gradlew compileDistribution -PskipWeb=true -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Maintenance Integration Test
        id: integrationTest
        # run embedded mode and deploy mode integration tests
        run: |
          ./gradlew -PskipTests -PtestMode=embedded -PskipDockerTests=false -PskipWeb=true :maintenance:optimizer:test --tests "org.apache.gravitino.maintenance.optimizer.integration.test.**"
          ./gradlew -PskipTests -PtestMode=deploy -PskipDockerTests=false -PskipWeb=true :maintenance:optimizer:test --tests "org.apache.gravitino.maintenance.optimizer.integration.test.**"

      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-xml-maintenance-${{ inputs.java-version }}
          path: |
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: maintenance-integrate-test-reports-${{ inputs.java-version }}
          path: |
            build/reports
            maintenance/optimizer/build/*.log
            maintenance/optimizer/build/*.tar
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
