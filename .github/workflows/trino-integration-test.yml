name: Trino Integration Test

# Controls when the workflow will run
on:
  workflow_dispatch:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    types: [labeled]
    branches: [ "main", "branch-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Integration test for AMD64 architecture
  test-amd64-arch:
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: [self-hosted, linux, x64, ubuntu-latest, xlarge]
    timeout-minutes: 60
    strategy:
      matrix:
        architecture: [linux/amd64]
        java-version: [ 17 ]
    env:
      PLATFORM: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Check required command
        run: |
          gravitino-internal/dev/ci/check_commands.sh

      - name: Package Gravitino
        run: |
          ./gradlew compileDistribution -x test -PjdkVersion=${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          gravitino-internal/dev/ci/util_free_space.sh

      - name: Copy distribution package
        run: |
          sed -i '/= *opensearch/d' ./distribution/package/conf/gravitino.conf
          sed -i '/= *search/d' ./distribution/package/conf/gravitino.conf
          echo "gravitino.datastrato.search.storage.impl = memory" >> ./distribution/package/conf/gravitino.conf 
          cp -r -f ./distribution ./gravitino-internal

      - name: Trino Integration Test
        id: integrationTest
        run: |
          ./gradlew -p gravitino-internal -PskipTests -PtestMode=deploy -PjdkVersion=${{ matrix.java-version }} -PskipDockerTests=false :trino-connector:integration-test:test

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v4
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: flink-connector-integrate-test-reports-${{ matrix.java-version }}
          path: |
            gravitino-internal/build/reports
            gravitino-internal/trino-connector/integrate-test/build/*.log
            gravitino-internal/trino-connector/integrate-test/build/*.tar
            gravitino-internal/integration-test-common/build/trino-ci-container-log
            gravitino-internal/distribution/package/logs/gravitino-server.out
            gravitino-internal/distribution/package/logs/gravitino-server.log
            gravitino-internal/catalogs/**/*.log
            gravitino-internal/catalogs/**/*.tar
