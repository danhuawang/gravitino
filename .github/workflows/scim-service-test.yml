name: SCIM Service Test

on:
  push:
    branches: ["main", "branch-*"]
  pull_request:
    types: [labeled]
    branches: ["main", "branch-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ci')
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - plugins/scim/service/**
              - integration-test-common/**
              - core/**
              - api/**
              - common/**
              - gradle/**
              - gradlew
              - dev/**
              - build.gradle.kts
              - gradle.properties
              - gradle/libs.versions.toml
              - settings.gradle.kts
              - .github/workflows/scim-service-test.yml
      - name: Detect scim service module
        id: module
        run: |
          if [ -f plugins/scim/service/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}
      module_exists: ${{ steps.module.outputs.exists }}

  scim-service-test:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true' && needs.changes.outputs.module_exists == 'true'
    runs-on: gcp-arc-runners
    timeout-minutes: 60
    env:
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Run scim service tests
        id: scimServiceTest
        env:
          dockerTest: true
        run: |
          set -euo pipefail

          # Unit tests and isolated scim-server/libs packaging checks (no Docker).
          ./gradlew :plugins:scim:service:test -PskipDockerTests=true

          # Jersey 3 SCIM auxiliary listener integration tests (h2 / MySQL / PostgreSQL).
          for backend in h2 mysql postgresql; do
            ./gradlew :plugins:scim:integration-test:test \
              -PjdbcBackend="${backend}" \
              -PskipDockerTests=false
          done

      - name: Upload scim service test reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.scimServiceTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: scim-service-test-reports
          path: |
            plugins/scim/service/build/reports
            plugins/scim/service/build/test-results
            plugins/scim/integration-test/build/reports
            plugins/scim/integration-test/build/test-results
            distribution/package/scim-server/libs
