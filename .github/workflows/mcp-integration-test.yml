name: mcp-integration-test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp_server_changes: ${{ steps.filter.outputs.mcp_server_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            mcp_server_changes:
              - 'mcp-server/**'

  mcp-authz-integration-test:
    runs-on: gcp-arc-runners
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.mcp_server_changes == 'true'
    env:
      LICENSE_PUBLIC_KEY_URL: ${{ secrets.ENTERPRISE_TEST_PUBLIC_KEY_URI }}
      GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
      GRAVITINO_LICENSE_KEY: ${{ secrets.ENTERPRISE_TEST_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install netcat
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Build Gravitino distribution
        run: ./gradlew compileDistribution -x test -PskipWeb=true

      - name: Run MCP authorization integration test
        env:
          GRAVITINO_HOME: ${{ github.workspace }}/distribution/package
        run: |
          ./mcp-server/dev/run_authz_integration_test.sh

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-authz-it-logs
          path: |
            distribution/package/logs/**
            mcp-server/gravitino-mcp-audit.log
            mcp-server/gravitino-mcp.log
          if-no-files-found: ignore
