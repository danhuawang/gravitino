#
# Trino with Gravitino Connector for E2E testing in Kind cluster.
# The image should have gravitino-trino-connector jars and conf baked in.
#
# Deploy:
#   export NAMESPACE=gravitino-test
#   export TRINO_IMAGE=datastratosandbox/gravitino:trino-20260602
#   export GRAVITINO_HOST_IP=gravitino-server
#   export GRAVITINO_HOST_PORT=8090
#   export GRAVITINO_METALAKE=my_metalake
#   envsubst < qa/k8s/trino-gravitino-connector-deployment.yaml | kubectl apply -f -
#
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-gravitino-catalog
  namespace: ${NAMESPACE}
data:
  gravitino.properties: |
    connector.name=gravitino
    gravitino.uri=http://${GRAVITINO_HOST_IP}:${GRAVITINO_HOST_PORT}
    gravitino.metalake=${GRAVITINO_METALAKE}
    gravitino.client.authType=oauth2
    gravitino.client.oauth2.serverUri=http://192.168.97.2:30080
    gravitino.client.oauth2.credential=postman-client:JKaXEyxp1TiTeVf5ggDSjdTiVixCxj37
    gravitino.client.oauth2.path=/realms/myrealm/protocol/openid-connect/token
    gravitino.client.oauth2.scope=openid profile email
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-gravitino
  namespace: ${NAMESPACE}
  labels:
    app: trino-gravitino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino-gravitino
  template:
    metadata:
      labels:
        app: trino-gravitino
    spec:
      containers:
        - name: trino
          image: ${TRINO_IMAGE}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GRAVITINO_HOST_IP
              value: "${GRAVITINO_HOST_IP}"
            - name: GRAVITINO_HOST_PORT
              value: "${GRAVITINO_HOST_PORT}"
            - name: GRAVITINO_METALAKE_NAME
              value: "${GRAVITINO_METALAKE}"
            - name: HADOOP_USER_NAME
              value: "root"
          command: ["/bin/bash", "-c"]
          args:
            - |
              cp /tmp/gravitino-catalog/gravitino.properties /etc/trino/catalog/gravitino.properties && /usr/lib/trino/bin/run-trino
          volumeMounts:
            - name: gravitino-catalog
              mountPath: /tmp/gravitino-catalog
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: gravitino-catalog
          configMap:
            name: trino-gravitino-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: trino-gravitino
  namespace: ${NAMESPACE}
  labels:
    app: trino-gravitino
spec:
  type: NodePort
  selector:
    app: trino-gravitino
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30881
      name: http
