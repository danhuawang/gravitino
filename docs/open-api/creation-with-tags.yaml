---

paths:

  /web/with-tags/metalakes/{metalake}/catalogs:
    parameters:
      - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
    post:
      tags:
        - catalog
      summary: Create catalog with tags
      operationId: createCatalogWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogWithTagsCreateRequest"
            examples:
              CatalogWithTagsCreate:
                $ref: "#/components/examples/CatalogWithTagsCreate"

      responses:
        "200":
          $ref: "#/components/responses/CatalogWithTagsResponse"
        "409":
          description: Conflict - The target catalog already exists in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                CatalogAlreadyExistsException:
                  $ref: "./../../gravitino-internal/docs/open-api/catalogs.yaml#/components/examples/CatalogAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/with-tags/metalakes/{metalake}/catalogs/{catalog}/schemas:
    parameters:
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/catalog"
    post:
      tags:
        - schema
      summary: Create schema with tags
      operationId: createSchemaWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaWithTagsCreateRequest"
            examples:
              SchemaWithTagsCreate:
                $ref: "#/components/examples/SchemaWithTagsCreate"

      responses:
        "200":
          $ref: "#/components/responses/SchemaWithTagsResponse"
        "409":
          description: Conflict - The target schema already exists in the specified catalog
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                SchemaAlreadyExistsException:
                  $ref: "./../../gravitino-internal/docs/open-api/schemas.yaml#/components/examples/SchemaAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/with-tags/metalakes/{metalake}/catalogs/{catalog}/schemas/{schema}/tables:
    parameters:
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/catalog"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/schema"
    post:
      tags:
        - table
      summary: Create table with tags
      operationId: createTableWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableWithTagsCreateRequest"
            examples:
              HiveTableWithTagsCreate:
                $ref: "#/components/examples/HiveTableWithTagsCreate"
      responses:
        "200":
          $ref: "#/components/responses/TableWithTagsResponse"
        "409":
          description: Conflict - The target table already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                TableAlreadyExistsErrorResponse:
                  $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/examples/TableAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/with-tags/metalakes/{metalake}/catalogs/{catalog}/schemas/{schema}/filesets:
    parameters:
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/catalog"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/schema"
    post:
      tags:
        - fileset
      summary: Create fileset with tags
      operationId: createFilesetWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilesetWithTagsCreateRequest"
            examples:
              FilesetWithTagsCreate:
                $ref: "#/components/examples/FilesetWithTagsCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/FilesetWithTagsResponse"
        "409":
          description: Conflict - The target fileset already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                FilesetAlreadyExistsErrorResponse:
                  $ref: "./../../gravitino-internal/docs/open-api/filesets.yaml#/components/examples/FilesetAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/with-tags/metalakes/{metalake}/catalogs/{catalog}/schemas/{schema}/topics:
    parameters:
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/catalog"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/schema"
    post:
      tags:
        - topic
      summary: Create topic with tags
      operationId: createTopicWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicWithTagsCreateRequest"
            examples:
              TopicWithTagsCreate:
                $ref: "#/components/examples/TopicWithTagsCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/TopicWithTagsResponse"
        "409":
          description: Conflict - The target topic already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                TopicAlreadyExistsErrorResponse:
                  $ref: "./../../gravitino-internal/docs/open-api/topics.yaml#/components/examples/TopicAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

  /web/with-tags/metalakes/{metalake}/catalogs/{catalog}/schemas/{schema}/models:
    parameters:
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/catalog"
        - $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/parameters/schema"
    post:
      tags:
        - model
      summary: Create model with tags
      operationId: createModelWithTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelWithTagsCreateRequest"
            examples:
              ModelWithTagsCreate:
                $ref: "#/components/examples/ModelWithTagsCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelWithTagsResponse"
        "409":
          description: Conflict - The target model already exists
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                ModelAlreadyExistsErrorResponse:
                  $ref: "./../../gravitino-internal/docs/open-api/models.yaml#/components/examples/ModelAlreadyExistsException"
        "5xx":
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    CatalogWithTags:
      type: object
      description: A catalog
      required:
        - name
        - type
        - provider
        - audit
        - tags
      properties:
        name:
          type: string
          description: The name of the catalog
        type:
          type: string
          description: The type of the catalog
          enum:
            - relational
            - fileset
            - messaging
        provider:
          type: string
          description: The provider of the catalog
          enum:
            - hive
            - lakehouse-iceberg
            - lakehouse-paimon
            - jdbc-mysql
            - jdbc-postgresql
            - jdbc-doris
            - hadoop
            - kafka
        comment:
          type: string
          description: A comment about the catalog
          nullable: true
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        tags:
          type: array
          description: A list of tags for the catalog
          items:
              type: string
        properties:
          type: object
          description: Configured string to string map of properties for the catalog
          default: { }
          additionalProperties:
            type: string

    SchemaWithTagsCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the schema
        comment:
          type: string
          description: A comment describing the schema
          nullable: true
        properties:
          type: object
          description: A map of properties for the schema
          nullable: true
          default: { }
          additionalProperties:
            type: string
        tagsToAdd:
          type: array
          description: A list of tags to add to the schema
          nullable: true
          default: [ ]
          items:
              type: string

    CatalogWithTagsCreateRequest:
      type: object
      required:
        - name
        - type
        - provider
      properties:
        name:
          type: string
          description: The name of the catalog
        type:
          type: string
          description: The type of the catalog
          enum:
            - relational
            - fileset
            - stream
        provider:
          type: string
          description: The provider of the catalog
          enum:
            - hive
            - lakehouse-iceberg
            - lakehouse-paimon
            - lakehouse-hudi
            - jdbc-mysql
            - jdbc-postgresql
            - jdbc-doris
            - jdbc-oceanbase
            - hadoop
            - kafka
        comment:
          type: string
          description: A comment for the catalog
          nullable: true
        properties:
          type: object
          description: A map of properties for the catalog
          nullable: true
          default: { }
          additionalProperties:
            type: string
        tagsToAdd:
          type: array
          description: A list of tags to add to the catalog
          nullable: true
          default: [ ]
          items:
              type: string

    SchemaWithTags:
      type: object
      description: A schema
      required:
        - name
        - audit
        - tags
      properties:
        name:
          type: string
          description: The name of the schema
        comment:
          type: string
          description: A comment describing the schema
          nullable: true
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        tags:
          type: array
          description: A list of tags for the schema
          items:
              type: string
        properties:
          type: object
          description: A map of properties for the schema
          nullable: true
          default: { }
          additionalProperties:
            type: string

    TableWithTagsCreateRequest:
      type: object
      required:
        - name
        - columns
      properties:
        name:
          type: string
          description: The name of the table
        columns:
          type: array
          description: A list of columns
          items:
            $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/Column"
        comment:
          type: string
          description: The comment of the table
          nullable: true
        properties:
          type: object
          description: A map of table properties
          nullable: true
          default: { }
          additionalProperties:
            type: string
        sortOrders:
          type: array
          description: Describes the sort order of the table data
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/SortOrder"
        distribution:
          $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/Distribution"
        partitioning:
          type: array
          description: partitioning of the table data
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/partitioning.yaml#/components/schemas/PartitioningSpec"
        indexes:
          type: array
          description: Indexes of the table
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/indexes.yaml#/components/schemas/IndexSpec"
        tagsToAdd:
          type: array
          description: A list of tags to add to the table
          nullable: true
          default: [ ]
          items:
              type: string
        columnTags:
          type: object
          description: A map of column tags
          nullable: true
          default: { }
          additionalProperties:
              type: array
              items:
                type: string

    TableWithTags:
      type: object
      description: A table object
      required:
        - name
        - columns
        - audit
        - tags
        - columnTags
      properties:
        name:
          type: string
          description: The name of the table
        columns:
          type: array
          description: A list of columns
          items:
            $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/Column"
        comment:
          type: string
          description: The comment of the table
          nullable: true
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        properties:
          type: object
          description: A map of table properties
          nullable: true
          default: { }
          additionalProperties:
            type: string
        distribution:
          $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/Distribution"
        sortOrders:
          type: array
          description: Describes the sort order of the table data
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/SortOrder"
        partitioning:
          type: array
          description: partitioning of the table data
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/partitioning.yaml#/components/schemas/PartitioningSpec"
        indexes:
          type: array
          description: Indexes of the table
          nullable: true
          default: [ ]
          items:
            $ref: "./../../gravitino-internal/docs/open-api/indexes.yaml#/components/schemas/IndexSpec"
        tags:
          type: array
          description: A list of tags for the table
          items:
              type: string
        columnTags:
          type: object
          description: A map of column tags
          nullable: true
          default: { }
          additionalProperties:
              type: array
              items:
                  type: string

    FilesetWithTagsCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the fileset. Can not be empty.
        type:
          type: string
          description: The type of the fileset. The value of type should be EXTERNAL or MANAGED
          nullable: true
        comment:
          type: string
          description: The comment of the fileset. Can be empty.
          nullable: true
        storageLocation:
          type: string
          description: The location of the fileset. If the storage location of managed fileset is empty, it will \
            use the location of namespace. The storage location of external fileset must be set.
          nullable: true
        properties:
          type: object
          description: The properties of the fileset. Can be empty.
          nullable: true
          default: { }
          additionalProperties:
            type: string
        tagsToAdd:
          type: array
          description: A list of tags to add to the fileset
          nullable: true
          default: [ ]
          items:
              type: string

    FilesetWithTags:
      type: object
      required:
        - name
        - tags
      properties:
        name:
          type: string
          description: The name of the fileset
        type:
          type: string
          description: The type of the fileset
          nullable: true
        comment:
          type: string
          description: The comment of the fileset
          nullable: true
        storageLocation:
          type: string
          description: The location of the fileset
          nullable: true
        properties:
          type: object
          description: The properties of the fileset
          nullable: true
          default: { }
          additionalProperties:
            type: string
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        tags:
          type: array
          description: A list of tags for the fileset
          items:
              type: string

    TopicWithTagsCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the topic
        comment:
          type: string
          description: The comment of the topic
          nullable: true
        properties:
          type: object
          description: The properties of the topic
          nullable: true
          default: { }
          additionalProperties:
            type: string
        tagsToAdd:
          type: array
          description: A list of tags to add to the topic
          nullable: true
          default: [ ]
          items:
              type: string

    TopicWithTags:
      type: object
      required:
        - name
        - tags
      properties:
        name:
          type: string
          description: The name of the topic
        comment:
          type: string
          description: The comment of the topic
        properties:
          type: object
          description: The properties of the topic
          nullable: true
          default: { }
          additionalProperties:
            type: string
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        tags:
          type: array
          description: A list of tags for the topic
          items:
              type: string

    ModelWithTagsCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the model
        comment:
          type: string
          description: The comment of the model
          nullable: true
        properties:
          type: object
          description: The properties of the model
          nullable: true
          default: { }
          additionalProperties:
            type: string
        tagsToAdd:
          type: array
          description: A list of tags to add to the model
          nullable: true
          default: [ ]
          items:
              type: string

    ModelWithTags:
      type: object
      required:
        - name
        - tags
      properties:
        name:
          type: string
          description: The name of the model
        comment:
          type: string
          description: The comment of the model
          nullable: true
        properties:
          type: object
          description: The properties of the model
          nullable: true
          default: { }
          additionalProperties:
            type: string
        audit:
          $ref: "./../../gravitino-internal/docs/open-api/openapi.yaml#/components/schemas/Audit"
        tags:
          type: array
          description: A list of tags for the model
          items:
              type: string

  responses:
    CatalogWithTagsResponse:
      description: Returns included catalog object with tags
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              catalog:
                $ref: "./../../gravitino-internal/docs/open-api/catalogs.yaml#/components/schemas/Catalog"
              tags:
                type: array
                description: A list of tags for the catalog
                items:
                    type: string
          examples:
            CatalogWithTagsResponse:
              $ref: "#/components/examples/CatalogWithTagsResponse"

    SchemaWithTagsResponse:
      description: Returns include the schema object
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              schema:
                $ref: "./../../gravitino-internal/docs/open-api/schemas.yaml#/components/schemas/Schema"
              tags:
                type: array
                description: A list of tags for the schema
                items:
                    type: string

          examples:
            SchemaWithTagsResponse:
              $ref: "#/components/examples/SchemaWithTagsResponse"

    TableWithTagsResponse:
      description: Returns include the table object with tags
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              table:
                $ref: "./../../gravitino-internal/docs/open-api/tables.yaml#/components/schemas/Table"
              tags:
                type: array
                description: A list of tags for the table
                items:
                    type: string
              columnTags:
                type: object
                description: A map of column tags
                nullable: true
                default: { }
                additionalProperties:
                  type: array
                  items:
                    type: string
          examples:
            TableWithTagsResponse:
              $ref: "#/components/examples/HiveTableWithTagsResponse"

    FilesetWithTagsResponse:
      description: The response of fileset object
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              fileset:
                $ref: "./../../gravitino-internal/docs/open-api/filesets.yaml#/components/schemas/Fileset"
              tags:
                type: array
                description: A list of tags for the fileset
                items:
                    type: string
          examples:
            FilesetWithTagsResponse:
              $ref: "#/components/examples/FilesetWithTagsResponse"

    TopicWithTagsResponse:
      description: Returns include the topic object
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              topic:
                $ref: "../../gravitino-internal/docs/open-api/topics.yaml#/components/schemas/Topic"
              tags:
                type: array
                description: A list of tags for the topic
                items:
                    type: string
          examples:
            TopicWithTagsResponse:
              $ref: "#/components/examples/TopicWithTagsResponse"

    ModelWithTagsResponse:
      description: Returns include the model object
      content:
        application/vnd.gravitino.v1+json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                description: Status code of the response
                enum:
                  - 0
              model:
                $ref: "../../gravitino-internal/docs/open-api/models.yaml#/components/schemas/Model"
              tags:
                type: array
                description: A list of tags for the model
                items:
                    type: string
          examples:
            ModelWithTagsResponse:
              $ref: "#/components/examples/ModelWithTagsResponse"

  examples:
    CatalogWithTagsCreate:
      value: {
        "name": "my-catalog",
        "type": "relational",
        "provider": "jdbc-mysql",
        "comment": "This is my catalog",
        "properties": {
          "key1": "value1",
          "key2": "value2"
        },
        "tagsToAdd": [ "tag1", "tag2" ]
      }

    CatalogWithTagsResponse:
      value: {
        "code": 0,
        "catalog": {
          "name": "my_hive_catalog",
          "type": "relational",
          "provider": "hive",
          "comment": "This is my hive catalog",
          "properties": {
            "key1": "value1",
            "gravitino.bypass.hive.metastore.client.capability.check": "false",
            "metastore.uris": "thrift://127.0.0.1:9083"
          },
          "audit": {
            "creator": "gravitino",
            "createTime": "2023-12-08T03:41:25.595Z"
          }
        },
        "tags": [ "tag1", "tag2" ]
      }

    SchemaWithTagsCreate:
      value: {
        "name": "my_hive_schema",
        "comment": "This is my Hive schema",
        "properties": {
          "location": "/user/hive/warehouse",
          "key1": "value1",
          "key2": "value2"
        },
        "tagsToAdd": [ "tag1", "tag2" ]
      }

    SchemaWithTagsResponse:
      value: {
        "code": 0,
        "schema": {
          "name": "my_hive_schema",
          "comment": "This is my Hive schema",
          "properties": {
            "key1": "value1",
            "key2": "value2",
            "location": "hdfs://0.0.0.0:9000/user/hive/warehouse"
          },
          "audit": {
            "creator": "gravitino",
            "createTime": "2023-12-08T08:37:43.531Z"
          }
        },
        "tags": [ "tag1", "tag2" ]
