---

paths:

  /metalakes/{metalake}/roles:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: List role names
      operationId: listRoles
      responses:
        "200":
          description: Returns the list of role  name
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/NameListResponse"
              examples:
                NameListResponse:
                  $ref: "#/components/examples/NameListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"

    post:
      tags:
        - access control
      summary: Create role
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreateRequest"
            examples:
              RoleCreateRequest:
                $ref: "#/components/examples/RoleCreateRequest"

      responses:
        "200":
          description: Returns the created role object
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/responses/RoleResponse"
              examples:
                RoleResponse:
                  $ref: "#/components/examples/RoleResponse"

        "400":
          description: Parameter is invalid - The specified securable object is invalid the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetadataObjectException:
                  $ref: "#/components/examples/IllegalMetadataObjectException"

        "409":
          description: Conflict - The target role already exists in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                RoleAlreadyExistsException:
                  $ref: "#/components/examples/RoleAlreadyExistsException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

  /metalakes/{metalake}/roles/{role}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "./openapi.yaml#/components/parameters/role"

    get:
      tags:
        - access control
      summary: Get Role
      operationId: getRole
      description: Returns the specified role information in the specified metalake
      responses:
        "200":
          description: Returns the role object
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/responses/RoleResponse"
                examples:
                  RoleResponse:
                    $ref: "#/components/examples/RoleResponse"
        "404":
          description: Not Found - The specified role does not exist in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchRoleException:
                  $ref: "#/components/examples/NoSuchRoleException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

    delete:
      tags:
        - access control
      summary: Delete role
      operationId: deleteRole
      responses:
        "200":
          $ref: "./openapi.yaml#/components/responses/DeleteResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

  /metalakes/{metalake}/objects/{metadataObjectType}/{metadataObjectFullName}/roles:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "#/components/parameters/metadataObjectTypeOfRole"
      - $ref: "./openapi.yaml#/components/parameters/metadataObjectFullName"

    get:
      tags:
        - access control
      summary: List role names for metadata object
      operationId: listRolesForObject
      responses:
        "200":
          description: Returns the list of role  name for the metadata object
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/NameListResponse"
              examples:
                NameListResponse:
                  $ref: "#/components/examples/NameListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchMetadataObjectException:
                  $ref: "#/components/examples/NoSuchMetadataObjectException"

  /web/security/metalakes/{metalake}/objects/roles:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: List metadata objects with role privileges
      operationId: listObjectRolePrivileges
      description: |
        Lists metadata objects under a metalake that have role privilege bindings,
        together with each object's associated roles and privileges.
      responses:
        "200":
          description: Returns metadata objects grouped with their role privileges
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/responses/ObjectRolePrivilegeListResponse"
              examples:
                ObjectRolePrivilegeListResponse:
                  $ref: "#/components/examples/ObjectRolePrivilegeListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"
  /web/security/metalakes/{metalake}/authorization/overview:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"

    get:
      tags:
        - access control
      summary: Get the metalake authorization overview
      operationId: getAuthorizationOverview
      description: |
        Returns metadata objects grouped by catalog, users and groups associated
        through roles, privileged principal share, and all visible
        roles with their direct members.

        A member is one directly assigned user or group; users contained in a group
        are not expanded. Privileged is the share of catalog principals holding an allowed
        write or admin privilege; denied and read-only privileges are excluded.
      responses:
        "200":
          description: Returns the authorization overview
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/responses/AuthorizationOverviewResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"



components:

  schemas:

    Privilege:
      type: object
      required:
        - name
        - condition
      properties:
        name:
          type: string
          enum:
            - CREATE_CATALOG
            - USE_CATALOG
            - CREATE_SCHEMA
            - USE_SCHEMA
            - CREATE_TABLE
            - MODIFY_TABLE
            - SELECT_TABLE
            - CREATE_FILESET
            - WRITE_FILESET
            - READ_FILESET
            - CREATE_TOPIC
            - PRODUCE_TOPIC
            - CONSUME_TOPIC
            - MANAGE_USERS
            - MANAGE_GROUPS
            - CREATE_ROLE
            - MANAGE_GRANTS
            - REGISTER_MODEL
            - LINK_MODEL_VERSION
            - USE_MODEL
            - REGISTER_FUNCTION
            - EXECUTE_FUNCTION
            - MODIFY_FUNCTION
            - CREATE_TAG
            - APPLY_TAG
            - CREATE_POLICY
            - APPLY_POLICY
            - REGISTER_JOB_TEMPLATE
            - USE_JOB_TEMPLATE
            - RUN_JOB
          description: The name of the privilege
        condition:
          type: string
          enum:
            - ALLOW
            - DENY
          description: The condition of the privilege, `ALLOW` or `DENY`

    SecurableObject:
      type: object
      required:
        - fullName
        - type
      properties:
        fullName:
          type: string
          description: The full name of the securable object
        type:
          type: string
          enum:
            - "METALAKE"
            - "CATALOG"
            - "SCHEMA"
            - "FILESET"
            - "TABLE"
            - "VIEW"
            - "TOPIC"
            - "COLUMN"
            - "ROLE"
            - "MODEL"
            - "TAG"
            - "POLICY"
            - "JOB"
            - "JOB_TEMPLATE"
            - "FUNCTION"
          description: The type of the securable object
        privileges:
          type: array
          description: A list of privileges
          items:
            $ref: "#/components/schemas/Privilege"

    Role:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the role
        properties:
          type: object
          description: A map of properties for the role
          nullable: true
          default: { }
          additionalProperties:
            type: string
        securableObjects:
          type: array
          description: A list of securable objects
          items:
            $ref: "#/components/schemas/SecurableObject"

    RoleCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the role
        properties:
          type: object
          description: A map of properties for the role
          nullable: true
          default: { }
          additionalProperties:
            type: string
        securableObjects:
          type: array
          description: A list of securable objects
          items:
            $ref: "#/components/schemas/SecurableObject"

    MetadataObject:
      type: object
      description: A metadata object
      required:
        - fullName
        - type
      properties:
        fullName:
          type: string
          description: The full name of the metadata object
        type:
          type: string
          description: The type of the metadata object
          enum:
            - "METALAKE"
            - "CATALOG"
            - "SCHEMA"
            - "FILESET"
            - "TABLE"
            - "VIEW"
            - "TOPIC"
            - "COLUMN"
            - "ROLE"
            - "MODEL"
            - "TAG"
            - "POLICY"
            - "JOB"
            - "JOB_TEMPLATE"
            - "FUNCTION"

    RolePrivilege:
      type: object
      required:
        - role
        - privileges
      properties:
        role:
          type: string
          description: The role name
        privileges:
          type: array
          description: The privileges granted to the role
          items:
            $ref: "#/components/schemas/Privilege"

    ObjectRolePrivilege:
      type: object
      required:
        - metadataObject
        - rolePrivileges
      properties:
        metadataObject:
          $ref: "#/components/schemas/MetadataObject"
        rolePrivileges:
          type: array
          description: The role privileges associated with the metadata object
          items:
            $ref: "#/components/schemas/RolePrivilege"
    ObjectAuthorization:
      type: object
      required:
        - metadataObject
        - rolePrivileges
      properties:
        metadataObject:
          $ref: "#/components/schemas/MetadataObject"
        rolePrivileges:
          type: array
          description: Explicit role privileges associated with the metadata object
          items:
            $ref: "#/components/schemas/RolePrivilege"

    CatalogAuthorization:
      type: object
      required:
        - catalog
        - objects
        - roles
        - users
        - groups
        - memberCount
        - privilegedPrincipalCount
        - privileged
      properties:
        catalog:
          type: string
          description: The catalog name
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ObjectAuthorization"
        roles:
          type: array
          items:
            type: string
        users:
          type: array
          description: Distinct users associated with the catalog through its roles
          items:
            type: string
        groups:
          type: array
          description: Distinct groups associated with the catalog through its roles
          items:
            type: string
        memberCount:
          type: integer
          format: int32
          description: Distinct user count plus distinct group count for the catalog
        privilegedPrincipalCount:
          type: integer
          format: int32
          description: Number of distinct catalog principals holding an allowed write or admin privilege
        privileged:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of catalog principals holding an allowed write or admin privilege

    RoleMembership:
      type: object
      required:
        - role
        - users
        - groups
        - userCount
        - groupCount
        - memberCount
        - assigned
        - catalogs
        - objectCount
        - privilegeCount
      properties:
        role:
          type: string
        users:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        userCount:
          type: integer
          format: int32
        groupCount:
          type: integer
          format: int32
        memberCount:
          type: integer
          format: int32
          description: Direct user assignments plus direct group assignments
        assigned:
          type: boolean
          description: Whether the role is assigned to at least one user or group
        catalogs:
          type: array
          items:
            type: string
        objectCount:
          type: integer
          format: int32
          description: Number of objects with explicit privileges in the role
        privilegeCount:
          type: integer
          format: int32
          description: Number of explicit privilege entries in the role

  responses:
    RoleResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        role:
          $ref: "#/components/schemas/Role"

    ObjectRolePrivilegeListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        objectRolePrivileges:
          type: array
          description: Metadata objects with their associated role privileges
          items:
            $ref: "#/components/schemas/ObjectRolePrivilege"
    AuthorizationOverviewResponse:
      type: object
      required:
        - code
        - catalogs
        - roles
        - unassignedRoles
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 0
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogAuthorization"
        roles:
          type: array
          description: All visible roles, including roles with no members
          items:
            $ref: "#/components/schemas/RoleMembership"
        unassignedRoles:
          type: array
          description: Roles that are not assigned to a user or group
          items:
            type: string

  examples:
    RoleCreateRequest:
      value: {
        "name": "role1",
        "properties": {"k1": "v1"},
        "securableObjects": [
          {
            "fullName" : "catalog1.schema1.table1",
            "type": "TABLE",
            "privileges": [
              {
                "name": "SELECT_TABLE",
                "condition": "ALLOW"
              }
            ]
          }
        ]
      }

    RoleResponse:
      value: {
        "code": 0,
        "role": {
          "name": "role1",
          "properties" : { "k1": "v1" },
          "securableObjects": [
            {
              "fullName": "catalog1.schema1.table1",
              "type": "TABLE",
              "privileges": [
                {
                    name: "SELECT_TABLE",
                    condition: "ALLOW"
                }
              ]
            }
          ]
        }
      }

    RoleAlreadyExistsException:
      value: {
        "code": 1004,
        "type": "RoleAlreadyExistsException",
        "message": "Role already exists",
        "stack": [
          "org.apache.gravitino.exceptions.RoleAlreadyExistsException: Role already exists: role1"
        ]
      }

    NoSuchRoleException:
      value: {
        "code": 1003,
        "type": "NoSuchRoleException",
        "message": "Role does not exist",
        "stack": [
          "org.apache.gravitino.exceptions.NoSuchRoleException: Role does not exist",
          "..."
        ]
      }

    IllegalMetadataObjectException:
      value: {
        "code": 1001,
        "type": "IllegalMetadataObjectException",
        "message": "Metadata object does not exist",
        "stack": [
          "org.apache.gravitino.exceptions.IllegalMetadataObjectException: Metadata object does not exist",
          "..."
        ]
      }

    NoSuchMetadataObjectException:
      value: {
        "code": 1003,
        "type": "NoSuchMetadataObjectException",
        "message": "Metadata object does not exist",
        "stack": [
          "org.apache.gravitino.exceptions.NoSuchMetadataObjectException: Metadata object does not exist",
          "..."
        ]
      }

    NameListResponse:
      value: {
        "code": 0,
        "names": [ "user1", "user2" ]
      }

    ObjectRolePrivilegeListResponse:
      value: {
        "code": 0,
        "objectRolePrivileges": [
          {
            "metadataObject": {
              "fullName": "catalog1.schema1.table1",
              "type": "TABLE"
            },
            "rolePrivileges": [
              {
                "role": "role1",
                "privileges": [
                  {
                    "name": "SELECT_TABLE",
                    "condition": "ALLOW"
                  }
                ]
              },
              {
                "role": "role2",
                "privileges": [
                  {
                    "name": "SELECT_TABLE",
                    "condition": "DENY"
                  }
                ]
              }
            ]
          }
        ]
      }
  parameters:
    metadataObjectTypeOfRole:
      name: metadataObjectType
      in: path
      description: The type of the metadata object
      required: true
      schema:
        type: string
        enum:
          - "METALAKE"
          - "CATALOG"
          - "SCHEMA"
          - "TABLE"
          - "FILESET"
          - "TOPIC"
          - "ROLE"
          - "MODEL"
          - "FUNCTION"
          - "TAG"
          - "POLICY"
          - "JOB_TEMPLATE"
