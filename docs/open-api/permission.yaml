---

paths:

  /web/security/metalakes/{metalake}/roles/{role}:
    parameters:
      - $ref: "../../docs-oss/open-api/openapi.yaml#/components/parameters/metalake"
      - $ref: "../../docs-oss/open-api/openapi.yaml#/components/parameters/role"
    put:
      tags:
        - permissions
      summary: update bulk objects' privileges
      operationId: bulkUpdateSecurableObjects
      description: |
        Update the privileges of the bulk securable objects for a specific role in a metalake.

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionUpdateRequest"

      responses:
        "200":
          description: Returns the updated role
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs-oss/open-api/roles.yaml#/components/responses/RoleResponse"
        "400":
          $ref: "../../docs-oss/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The target role does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../../docs-oss/open-api/openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "../../docs-oss/open-api/metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchRoleException:
                  $ref: "../../docs-oss/open-api/roles.yaml#/components/examples/NoSuchRoleException"
        "5xx":
          $ref: "../../docs-oss/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    PermissionUpdateRequest:
      type: object
      properties:
        updates:
          type: array
          description: A list of securable objects to update
          items:
            $ref: "../../docs-oss/open-api/roles.yaml#/components/schemas/SecurableObject"
