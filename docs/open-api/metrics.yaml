---

paths:

  /web/metrics/metalakes/{metalake}:
    get:
      tags:
        - metrics
      summary: Get metrics
      operationId: getMetrics
      description: |
        Get asset metrics under the specified metalake for the request user, this endpoint is used for dashboard in Web UI.
      parameters:
        - $ref: "./../../gravitino-oss/docs/open-api/openapi.yaml#/components/parameters/metalake"
        - name: metrics
          in: query
          description: The metrics to retrieve, comma-separated list of metric names, if not specified, all metrics will be returned
          required: false
          schema:
            type: string
        - name: startTimestamp
          in: query
          description: The start timestamp in milliseconds since epoch. If not specified, it defaults to the beginning of the current day.
          required: false
          schema:
            type: integer
            format: int64
        - name: endTimestamp
          in: query
          description: The end timestamp in milliseconds since epoch. If not specified, it defaults to the current time.
          required: false
          schema:
            type: integer
            format: int64
        - name: refresh
          in: query
          description: Whether to force a refresh and recalculate the metrics, if true, it will block until the refresh is complete.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Returns the metrics for the specified metalake and parameters.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

        "400":
          $ref: "./../../gravitino-oss/docs/open-api/openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "./../../gravitino-oss/docs/open-api/openapi.yaml#/components/responses/ServerErrorResponse"

components:
  schemas:
    MetricsResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        metrics:
          type: object
          description: A map of metric data, where the key is the metric name.
          additionalProperties:
            $ref: '#/components/schemas/Metric'

    Metric:
      type: object
      description: Represents a single time-series metric.
      properties:
        name:
          type: string
          description: The name of the metric
        values:
          type: array
          description: The array of metric values.
          items:
            type: number
            format: double
        timestamps:
          type: array
          description: The array of timestamps corresponding to the metric values.
          items:
            type: integer
            format: int64
