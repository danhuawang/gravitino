#
# Trino with the Iceberg REST connector pointed at the Gravitino IRC.
#
# Templated by qa/scripts/setup-kind-env.sh; the following placeholders are
# substituted via `sed` at deploy time:
#
#   gravitino-e2e-env2-oauth2-auth         – kube namespace (matches Gravitino's namespace).
#   ${IRC_SERVICE_URL}         – in-cluster IRC URL, e.g.
#                                http://gravitino.<ns>:9001/iceberg/
#   ${KEYCLOAK_TOKEN_URI}      – in-cluster Keycloak token endpoint, e.g.
#                                http://keycloak.<ns>:8080/realms/myrealm/protocol/openid-connect/token
#   ${TRINO_OAUTH2_CREDENTIAL} – `<client_id>:<client_secret>` for the Trino
#                                client_credentials grant against Keycloak.
#   ${TRINO_OAUTH2_SCOPE}      – OAuth2 scope, e.g. "openid profile email".
#
# Component dependency: this manifest pins
# `iceberg.rest-catalog.security=OAUTH2`. Trino's Iceberg connector only
# supports `OAUTH2` and `NONE` for REST-catalog auth, so a Keycloak deployment
# is required for Trino to connect successfully. The setup script enforces
# that `--component trino` also requires `--component keycloak`.
#
# NodePort 30880 is exposed on the host for ad-hoc queries via the Trino CLI
# / SQLAlchemy driver. Trino reaches IRC and Keycloak via in-cluster Service
# DNS, never via NodePort.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog-config
  namespace: gravitino-e2e-env2-oauth2-auth
data:
  gravitino_irc.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://gravitino.gravitino-e2e-env2-oauth2-auth:9001/iceberg/
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.server-uri=http://keycloak.gravitino-e2e-env2-oauth2-auth:8080/realms/myrealm/protocol/openid-connect/token
    iceberg.rest-catalog.oauth2.credential=postman-client:JKaXEyxp1TiTeVf5ggDSjdTiVixCxj37
    iceberg.rest-catalog.oauth2.scope=openid profile email
    iceberg.rest-catalog.oauth2.token-exchange-enabled=false
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.rest-catalog.nested-namespace-enabled=true

  gravitino_irc_s3.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://gravitino.gravitino-e2e-env2-oauth2-auth:9001/iceberg/
    iceberg.rest-catalog.prefix=catalog_iceberg_s3
    iceberg.rest-catalog.warehouse=catalog_iceberg_s3
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.server-uri=http://keycloak.gravitino-e2e-env2-oauth2-auth:8080/realms/myrealm/protocol/openid-connect/token
    iceberg.rest-catalog.oauth2.credential=postman-client:JKaXEyxp1TiTeVf5ggDSjdTiVixCxj37
    iceberg.rest-catalog.oauth2.scope=openid profile email
    iceberg.rest-catalog.oauth2.token-exchange-enabled=false
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.rest-catalog.nested-namespace-enabled=true
    fs.native-s3.enabled=true
    s3.region=us-east-1

  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    internal-communication.shared-secret=irc-e2e-internal-secret

  jvm.config: |
    -server
    -Xmx2G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000

  node.properties: |
    node.environment=test
    node.id=trino-e2e-node-1
    node.data-dir=/data/trino

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: gravitino-e2e-env2-oauth2-auth
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
        - name: trino
          image: kind-registry:5000/trino:480
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: catalog-config
              mountPath: /etc/trino/catalog/gravitino_irc.properties
              subPath: gravitino_irc.properties
            - name: catalog-config
              mountPath: /etc/trino/catalog/gravitino_irc_s3.properties
              subPath: gravitino_irc_s3.properties      
            - name: catalog-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: catalog-config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: catalog-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: catalog-config
          configMap:
            name: trino-catalog-config
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: gravitino-e2e-env2-oauth2-auth
spec:
  type: NodePort
  selector:
    app: trino
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
      name: http
