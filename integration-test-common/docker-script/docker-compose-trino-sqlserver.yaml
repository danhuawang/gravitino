x-mssql-sa-password: &mssql-sa-password "GravitinoDs_123!"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trino-ci-mssql
    networks:
      - trino-sqlserver-net
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *mssql-sa-password
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 60s
      retries: 30

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trino-ci-mssql-init
    networks:
      - trino-sqlserver-net
    environment:
      MSSQL_SA_PASSWORD: *mssql-sa-password
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "mssql", "-U", "sa", "-P", *mssql-sa-password, "-C", "-Q", "IF DB_ID('gt_db') IS NULL CREATE DATABASE gt_db"]

  trino:
    image: trinodb/trino:${TRINO_VERSION:-478}
    container_name: trino-ci-trino
    networks:
      - trino-sqlserver-net
    environment:
      - HADOOP_USER_NAME=anonymous
      - GRAVITINO_HOST_IP=host.docker.internal
      - GRAVITINO_HOST_PORT=${GRAVITINO_SERVER_PORT:-8090}
      - GRAVITINO_METALAKE_NAME=test
      - TRINO_WORKER_NUM=0
      - TRINO_ROLE=coordinator
    entrypoint: /bin/bash /tmp/trino/init.sh
    volumes:
      - ./init/trino:/tmp/trino
      - ${GRAVITINO_TRINO_CONNECTOR_DIR:-../../trino-connector/trino-connector-473-478/build/libs}:/usr/lib/trino/plugin/gravitino
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 60s
      retries: 5
    depends_on:
      mssql:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully

networks:
  trino-sqlserver-net:
    driver: bridge
    name: trino-sqlserver-net
